    <script>
    // Load sql.js from CDN
    const SQL_JS_URL = "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js";
    let SQL, db;
    function loadSqlJs() {
        return new Promise((resolve, reject) => {
            if (window.initSqlJs) return resolve(window.initSqlJs);
            const script = document.createElement('script');
            script.src = SQL_JS_URL;
            script.onload = () => resolve(window.initSqlJs);
            script.onerror = reject;
            document.head.appendChild(script);
        });
    }
    async function initDatabase() {
        SQL = await loadSqlJs().then(f => f({ locateFile: filename => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${filename}` }));
        // Try to load from IndexedDB
        const dbData = await loadDbFromIndexedDB();
        db = dbData ? new SQL.Database(new Uint8Array(dbData)) : new SQL.Database();
        db.run(`CREATE TABLE IF NOT EXISTS actions (id INTEGER PRIMARY KEY AUTOINCREMENT, type TEXT, details TEXT, ts DATETIME DEFAULT CURRENT_TIMESTAMP)`);
        saveDbToIndexedDB();
    }
    function saveDbToIndexedDB() {
        if (!db) return;
        const data = db.export();
        const request = window.indexedDB.open('ProgressTrackerDB', 1);
        request.onupgradeneeded = function(e) {
            const dbx = e.target.result;
            if (!dbx.objectStoreNames.contains('sqlite')) dbx.createObjectStore('sqlite');
        };
        request.onsuccess = function(e) {
            const dbx = e.target.result;
            const tx = dbx.transaction('sqlite', 'readwrite');
            tx.objectStore('sqlite').put(data, 'main');
        };
    }
    function loadDbFromIndexedDB() {
        return new Promise(resolve => {
            const request = window.indexedDB.open('ProgressTrackerDB', 1);
            request.onupgradeneeded = function(e) {
                const dbx = e.target.result;
                if (!dbx.objectStoreNames.contains('sqlite')) dbx.createObjectStore('sqlite');
            };
            request.onsuccess = function(e) {
                const dbx = e.target.result;
                const tx = dbx.transaction('sqlite', 'readonly');
                const getReq = tx.objectStore('sqlite').get('main');
                getReq.onsuccess = function() {
                    resolve(getReq.result || null);
                };
                getReq.onerror = function() { resolve(null); };
            };
            request.onerror = function() { resolve(null); };
        });
    }
    function insertAction(type, details) {
        db.run(`INSERT INTO actions (type, details) VALUES (?, ?)`, [type, JSON.stringify(details)]);
        saveDbToIndexedDB();
    }
    function getSummary() {
        const res = db.exec('SELECT type, COUNT(*) as count FROM actions GROUP BY type');
        return res.length ? res[0].values : [];
    }
    function getAllActions() {
        const res = db.exec('SELECT * FROM actions ORDER BY ts DESC LIMIT 50');
        return res.length ? res[0].values : [];
    }
    // Load Chart.js from CDN
    const CHART_JS_URL = "https://cdn.jsdelivr.net/npm/chart.js";
    function loadChartJs() {
        return new Promise((resolve, reject) => {
            if (window.Chart) return resolve(window.Chart);
            const script = document.createElement('script');
            script.src = CHART_JS_URL;
            script.onload = () => resolve(window.Chart);
            script.onerror = reject;
            document.head.appendChild(script);
        });
    }
        const icon = document.getElementById('sqlSummaryIcon');
        const panel = document.getElementById('sqlSummaryPanel');
        const closeBtn = document.getElementById('closeSqlSummary');
        const resetBtn = document.getElementById('resetSqlContent');
        const chartIcon = document.getElementById('chartIcon');
        const chartPanel = document.getElementById('chartPanel');

        });
        chartIcon.addEventListener('click', async () => {
            chartPanel.style.display = 'block';
            panel.style.display = 'none';
            await loadChartJs();
            renderBudgetChart();
        });
        closeChartBtn.addEventListener('click', () => chartPanel.style.display = 'none');

        function renderBudgetChart() {
            if (!window.Chart) return;
            const ctx = document.getElementById('budgetChart').getContext('2d');
            // Get all budget actions from SQLite
            const res = db.exec('SELECT ts, details FROM actions WHERE type = "budget_adjust" ORDER BY ts ASC');
            let data = [];
            if (res.length && res[0].values) {
                data = res[0].values.map(([ts, details]) => {
                    let val = 0;
                    try { val = JSON.parse(details).value || 0; } catch(e) {}
                    return { ts, val };
                });
            }
            // Find last 10/25 and next 10/25
            const now = new Date();
            let lastDate, nextDate;
            const d = now.getDate();
            const m = now.getMonth();
            const y = now.getFullYear();
            if (d < 10) {
                lastDate = new Date(y, m-1, 25);
                nextDate = new Date(y, m, 10);
            } else if (d <= 25) {
                lastDate = new Date(y, m, 10);
                nextDate = new Date(y, m, 25);
            } else {
                lastDate = new Date(y, m, 25);
                nextDate = new Date(y, m+1, 10);
            }
            // Prepare daily labels and budget values
            const startTime = lastDate.getTime();
            const endTime = nextDate.getTime();
            const numDays = Math.ceil((endTime - startTime) / (1000*60*60*24));
            const labels = [];
            const actualValues = [];
            // Find last known budget before period
            let initialBudget = 0;
            if (data.length) {
                for (let i = data.length - 1; i >= 0; i--) {
                    if (new Date(data[i].ts).getTime() < startTime) {
                        initialBudget = parseFloat(data[i].val);
                        break;
                    }
                }
            }
            // If no previous budget, try localStorage
            if (!initialBudget) {
                try {
                    initialBudget = parseFloat(localStorage.getItem('budgetCalculator_budget')) || 0;
                } catch(e) {}
            }
            let currentBudget = initialBudget;
            let dataIdx = 0;
            const todayTime = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
            for (let i = 0; i < numDays; i++) {
                const dayTime = startTime + i * 24 * 60 * 60 * 1000;
                const dateLabel = new Date(dayTime).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
                labels.push(dateLabel);
                // Find if there is a budget entry for this day
                let found = false;
                for (let j = 0; j < data.length; j++) {
                    const entryTime = new Date(data[j].ts).getTime();
                    if (entryTime >= dayTime && entryTime < dayTime + 24*60*60*1000) {
                        actualValues.push(parseFloat(data[j].val));
                        found = true;
                        break;
                    }
                }
                if (!found || dayTime > todayTime) {
                    actualValues.push(null);
                }
            }
            // Find current budget for today
            let todayBudget = initialBudget;
            for (let j = 0; j < data.length; j++) {
                const entryTime = new Date(data[j].ts).getTime();
                if (entryTime >= todayTime && entryTime < todayTime + 24*60*60*1000) {
                    todayBudget = parseFloat(data[j].val);
                }
            }
            // Projected budget: linear decrease from todayBudget to 0
            const projectedValues = [];
            for (let i = 0; i < numDays; i++) {
                if (i < (todayTime - startTime) / (24*60*60*1000)) {
                    projectedValues.push(null);
                } else {
                    const daysFromToday = i - ((todayTime - startTime) / (24*60*60*1000));
                    const daysToEnd = numDays - 1 - ((todayTime - startTime) / (24*60*60*1000));
                    const val = daysToEnd > 0 ? todayBudget * (1 - daysFromToday / daysToEnd) : todayBudget;
                    projectedValues.push(Math.max(0, val));
                }
            }
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        { label: 'Budget', data: actualValues, borderColor: '#4ac3ff', backgroundColor: 'rgba(76,195,255,0.2)', fill: true, stepped: true },
                        { label: 'Projected Budget', data: projectedValues, borderColor: '#ff9800', backgroundColor: 'rgba(255,152,0,0.1)', fill: false, borderDash: [5,5] }
                    ]
                },
                options: {
                    plugins: { legend: { display: true } },
                    scales: {
                        x: { title: { display: true, text: 'Date' } },
                        y: { title: { display: true, text: 'Budget' } }
                    }
                }
            });
        }
        function updateSqlSummaryPanel() {
            const content = document.getElementById('sqlSummaryContent');
            let html = '<b>Action Summary:</b><br><ul>';
            for (const [type, count] of getSummary()) {
                html += `<li>${type}: ${count}</li>`;
            }
            html += '</ul><b>Recent Actions:</b><br><table border="1" style="width:100%;"><tr><th>Type</th><th>Details</th><th>Time</th></tr>';
            for (const row of getAllActions()) {
                html += `<tr><td>${row[1]}</td><td>${row[2]}</td><td>${row[3]}</td></tr>`;
            }
            html += '</table>';
            content.innerHTML = html;
        }
        // Initialize DB on load
        document.addEventListener('DOMContentLoaded', () => { initDatabase(); });
    // Utility: Month names
    const MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const SHORT_MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    // --- Utility: set progress bar width and text (reusable) ---
    function setBar(barEl, textEl, percent) {
        barEl.style.width = `${percent}%`;
        textEl.textContent = `${Math.round(percent)}%`;
    }

    // --- Utility: Add multiple event listeners (reusable) ---
    function addListeners(target, events, handler) {
        events.forEach(ev => target.addEventListener(ev, handler));
    }

    // --- Utility: Panel toggling abstraction ---
    function setupPanelToggle(container, panel, showFn, hideFn) {
        let open = false;
        container.addEventListener('click', (e) => {
            // Only toggle if the click is directly on the container or its main children
            if (
                e.target === container ||
                e.target.classList.contains('progress-bar') ||
                e.target.classList.contains('progress-label') ||
                e.target.classList.contains('progress-percentage') ||
                e.target.classList.contains('progress-header') ||
                e.target.classList.contains('progress-label-section')
            ) {
                open = !open;
                open ? showFn() : hideFn();
            }
        });
        // Close panel when clicking outside
        document.addEventListener('click', (e) => {
            if (open && !panel.contains(e.target) && !container.contains(e.target)) {
                hideFn();
                open = false;
            }
        });
        // Prevent panel clicks from propagating
        panel.addEventListener('click', e => e.stopPropagation());
    }

        class DateCalculator {
            constructor() {}
            // Calculate working and non-working days between 10th and 25th of next month
            calculateDays() {
                const now = new Date();
                const nextMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
                const startDate = new Date(nextMonth.getFullYear(), nextMonth.getMonth(), 10);
                const endDate = new Date(nextMonth.getFullYear(), nextMonth.getMonth(), 25);
                let workingDays = 0, nonWorkingDays = 0, totalDays = 0;
                const currentDate = new Date(startDate);
                while (currentDate <= endDate) {
                    const dayOfWeek = currentDate.getDay();
                    totalDays++;
                    if (dayOfWeek === 0 || dayOfWeek === 6) nonWorkingDays++;
                    else workingDays++;
                    currentDate.setDate(currentDate.getDate() + 1);
                }
                return { workingDays, nonWorkingDays, totalDays };
            }
            getNextMonthInfo() {
                const now = new Date();
                const nextMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
                return {
                    month: MONTH_NAMES[nextMonth.getMonth()],
                    year: nextMonth.getFullYear()
                };
            }
            getNextWorkingDayInfo() {
                const now = new Date();
                const currentMonth = now.getMonth();
                const currentYear = now.getFullYear();
                const currentDate = now.getDate();
                if (currentDate < 10) {
                    const targetDate = new Date(currentYear, currentMonth, 10);
                    const nextWorkingDay = this.findNextWorkingDay(targetDate);
                    return {
                        date: nextWorkingDay,
                        monthName: MONTH_NAMES[nextWorkingDay.getMonth()],
                        isCurrentMonth: true
                    };
                } else if (currentDate <= 25) {
                    const tomorrow = new Date(now);
                    tomorrow.setDate(now.getDate() + 1);
                    const nextWorkingDay = this.findNextWorkingDay(tomorrow);
                    if (nextWorkingDay.getMonth() === currentMonth && nextWorkingDay.getDate() <= 25) {
                        return {
                            date: nextWorkingDay,
                            monthName: MONTH_NAMES[nextWorkingDay.getMonth()],
                            isCurrentMonth: true
                        };
                    } else {
                        const nextMonth = new Date(currentYear, currentMonth + 1, 10);
                        const nextWorkingDay = this.findNextWorkingDay(nextMonth);
                        return {
                            date: nextWorkingDay,
                            monthName: MONTH_NAMES[nextWorkingDay.getMonth()],
                            isCurrentMonth: false
                        };
                    }
                } else {
                    const nextMonth = new Date(currentYear, currentMonth + 1, 10);
                    const nextWorkingDay = this.findNextWorkingDay(nextMonth);
                    return {
                        date: nextWorkingDay,
                        monthName: MONTH_NAMES[nextWorkingDay.getMonth()],
                        isCurrentMonth: false
                    };
                }
            }
            findNextWorkingDay(startDate) {
                const date = new Date(startDate);
                while (date.getDay() === 0 || date.getDay() === 6) date.setDate(date.getDate() + 1);
                return date;
            }
            getProgressInfo() {
                const now = new Date();
                const currentYear = now.getFullYear();
                const currentMonth = now.getMonth();
                const currentDate = now.getDate();
                let lastCriteriaDate, nextCriteriaDate;
                if (currentDate < 10) {
                    lastCriteriaDate = new Date(currentYear, currentMonth - 1, 25, 14, 0, 0, 0);
                    nextCriteriaDate = new Date(currentYear, currentMonth, 10, 14, 0, 0, 0);
                } else if (currentDate <= 25) {
                    lastCriteriaDate = new Date(currentYear, currentMonth, 10, 14, 0, 0, 0);
                    nextCriteriaDate = new Date(currentYear, currentMonth, 25, 14, 0, 0, 0);
                } else {
                    lastCriteriaDate = new Date(currentYear, currentMonth, 25, 14, 0, 0, 0);
                    nextCriteriaDate = new Date(currentYear, currentMonth + 1, 10, 14, 0, 0, 0);
                }
                const totalHours = (nextCriteriaDate - lastCriteriaDate) / (1000 * 60 * 60);
                let hoursPassed = (now - lastCriteriaDate) / (1000 * 60 * 60);
                hoursPassed = Math.max(0, Math.min(hoursPassed, totalHours));
                const progressPercentage = Math.min(Math.max((hoursPassed / totalHours) * 100, 0), 100);
                let totalDays = 0;
                let temp = new Date(lastCriteriaDate);
                while (temp < nextCriteriaDate) { totalDays++; temp.setDate(temp.getDate() + 1); }
                let daysPassed = 0;
                temp = new Date(lastCriteriaDate);
                while (temp < now) { daysPassed++; temp.setDate(temp.getDate() + 1); }
                return {
                    lastDate: lastCriteriaDate,
                    nextDate: nextCriteriaDate,
                    daysPassed,
                    totalDays,
                    progressPercentage
                };
            }
            getWorkingHoursProgress() {
                const now = new Date();
                const currentHour = now.getHours();
                const currentMinute = now.getMinutes();
                const currentDay = now.getDay();
                const isWorkingDay = currentDay >= 1 && currentDay <= 5;
                if (!isWorkingDay) {
                    return { isWorkingDay: false, hoursElapsed: 0, hoursRemaining: 8, progressPercentage: 0, status: 'Weekend' };
                }
                const workStart = 10, workEnd = 18, totalWorkHours = workEnd - workStart;
                const currentTimeInHours = currentHour + (currentMinute / 60);
                let hoursElapsed, hoursRemaining, progressPercentage, status;
                if (currentTimeInHours < workStart) {
                    hoursElapsed = 0; hoursRemaining = totalWorkHours; progressPercentage = 0; status = 'Before hours';
                } else if (currentTimeInHours >= workEnd) {
                    hoursElapsed = totalWorkHours; hoursRemaining = 0; progressPercentage = 100; status = 'Complete';
                } else {
                    hoursElapsed = currentTimeInHours - workStart;
                    hoursRemaining = workEnd - currentTimeInHours;
                    progressPercentage = (hoursElapsed / totalWorkHours) * 100;
                    status = 'Active';
                }
                return {
                    isWorkingDay: true,
                    hoursElapsed: Math.max(0, hoursElapsed),
                    hoursRemaining: Math.max(0, hoursRemaining),
                    progressPercentage: Math.min(Math.max(progressPercentage, 0), 100),
                    status
                };
            }
            return { workingDays, nonWorkingDays, totalDays };
        }
        function getProgressInfo() {
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth();
            const currentDate = now.getDate();
            let lastCriteriaDate, nextCriteriaDate, baseDay;
            // Helper to get next working day on or after a date
            function nextWorkingDay(date) {
                let d = new Date(date);
                while (d.getDay() === 0 || d.getDay() === 6) { // 0=Sun, 6=Sat
                    d = dateFns.addDays(d, 1);
                }
                return d;
            }
            if (currentDate < 10) {
                lastCriteriaDate = dateFns.set(new Date(currentYear, currentMonth - 1, 25), {hours: 14, minutes: 0, seconds: 0, milliseconds: 0});
                baseDay = dateFns.set(new Date(currentYear, currentMonth, 10), {hours: 14, minutes: 0, seconds: 0, milliseconds: 0});
                nextCriteriaDate = nextWorkingDay(baseDay);
            } else if (currentDate <= 25) {
                lastCriteriaDate = dateFns.set(new Date(currentYear, currentMonth, 10), {hours: 14, minutes: 0, seconds: 0, milliseconds: 0});
                baseDay = dateFns.set(new Date(currentYear, currentMonth, 25), {hours: 14, minutes: 0, seconds: 0, milliseconds: 0});
                nextCriteriaDate = nextWorkingDay(baseDay);
            } else {
                lastCriteriaDate = dateFns.set(new Date(currentYear, currentMonth, 25), {hours: 14, minutes: 0, seconds: 0, milliseconds: 0});
                baseDay = dateFns.set(new Date(currentYear, currentMonth + 1, 10), {hours: 14, minutes: 0, seconds: 0, milliseconds: 0});
                nextCriteriaDate = nextWorkingDay(baseDay);
            }
            const totalHours = dateFns.differenceInHours(nextCriteriaDate, lastCriteriaDate);
            let hoursPassed = dateFns.differenceInHours(now, lastCriteriaDate);
            hoursPassed = Math.max(0, Math.min(hoursPassed, totalHours));
            const progressPercentage = Math.min(Math.max((hoursPassed / totalHours) * 100, 0), 100);
            const totalDays = dateFns.differenceInCalendarDays(nextCriteriaDate, lastCriteriaDate);
            const daysPassed = dateFns.differenceInCalendarDays(now, lastCriteriaDate);
            return {
                lastDate: lastCriteriaDate,
                nextDate: nextCriteriaDate,
                daysPassed,
                totalDays,
                progressPercentage
            };
        }
        function getWorkingHoursProgress() {
            const now = new Date();
            const currentDay = now.getDay();
            const isWorkingDay = currentDay >= 1 && currentDay <= 5;
            if (!isWorkingDay) {
                return { isWorkingDay: false, hoursElapsed: 0, hoursRemaining: 8, progressPercentage: 0, status: 'Weekend' };
            }
            const workStart = dateFns.set(now, { hours: 10, minutes: 0, seconds: 0, milliseconds: 0 });
            const workEnd = dateFns.set(now, { hours: 18, minutes: 0, seconds: 0, milliseconds: 0 });
            const totalWorkMs = dateFns.differenceInMilliseconds(workEnd, workStart);
            let hoursElapsed, hoursRemaining, progressPercentage, status;
            if (dateFns.isBefore(now, workStart)) {
                hoursElapsed = 0;
                hoursRemaining = totalWorkMs / 3600000;
                progressPercentage = 0;
                status = 'Before hours';
            } else if (dateFns.isAfter(now, workEnd)) {
                hoursElapsed = totalWorkMs / 3600000;
                hoursRemaining = 0;
                progressPercentage = 100;
                status = 'Complete';
            } else {
                hoursElapsed = dateFns.differenceInMilliseconds(now, workStart) / 3600000;
                hoursRemaining = dateFns.differenceInMilliseconds(workEnd, now) / 3600000;
                progressPercentage = (hoursElapsed / (totalWorkMs / 3600000)) * 100;
                status = 'Active';
            }
            return {
                isWorkingDay: true,
                hoursElapsed: Math.max(0, hoursElapsed),
                hoursRemaining: Math.max(0, hoursRemaining),
                progressPercentage: Math.min(Math.max(progressPercentage, 0), 100),
                status
            };
        }
        // --- LocalStorage helpers ---
        function loadBudget() {
            try {
                const savedBudget = localStorage.getItem('budgetCalculator_budget');
                return savedBudget ? parseFloat(savedBudget) : null;
            } catch {
                return null;
            }
        }
        function saveBudget(budget) {
            try {
                localStorage.setItem('budgetCalculator_budget', budget.toString());
            } catch {}
        }
        function loadTasks() {
            try {
                const savedTasks = localStorage.getItem('progressTracker_tasks');
                return savedTasks ? JSON.parse(savedTasks) : [];
            } catch {
                return [];
            }
        }
        function saveTasks(tasks) {
            try {
                localStorage.setItem('progressTracker_tasks', JSON.stringify(tasks));
            } catch {}
        }
        // --- React Components using MUI ---
        function ProgressPanel({ budget, onBudgetChange }) {
            const [progress, setProgress] = React.useState(getProgressInfo());
            const [open, setOpen] = React.useState(false);
            React.useEffect(() => {
                const interval = setInterval(() => setProgress(getProgressInfo()), 60000);
                return () => clearInterval(interval);
            }, []);
            const daysRemaining = progress.totalDays - progress.daysPassed;
            const dailyRate = budget && daysRemaining > 0 ? Math.round(budget / daysRemaining) : 0;
            return (
                <Paper elevation={3} sx={{p:2, mt:2, bgcolor:'#2d3561', cursor:'pointer'}} onClick={e => { if (!open) setOpen(true); }}>
                    <Box display="flex" justifyContent="space-between" alignItems="center" mb={1}>
                        <Box display="flex" alignItems="center" gap={1}>
                            <Typography fontWeight={600} color="#fff">Progress</Typography>
                            <Typography fontWeight={600} color="#fff">{Math.round(progress.progressPercentage)}%</Typography>
                        </Box>
                        <Typography fontWeight={600} color="#fff">{SHORT_MONTH_NAMES[progress.nextDate.getMonth()]} {progress.nextDate.getDate()}</Typography>
                    </Box>
                    <Box position="relative" width="100%">
                        <LinearProgress variant="determinate" value={progress.progressPercentage} sx={{height:16, borderRadius:2, bgcolor:'#222', '& .MuiLinearProgress-bar': {background:'#20b2ff'} }} />
                        <Box position="absolute" top={0} left={0} width="100%" height="100%" display="flex" alignItems="center" justifyContent="center">
                            <Typography fontWeight={600} color="#fff" fontSize={14}>{daysRemaining} days{budget && daysRemaining > 0 ? ` at ${dailyRate} RON/day` : ''}</Typography>
                        </Box>
                    </Box>
                    <BudgetAdjustmentPanel open={open} onClose={()=>setOpen(false)} budget={budget} onBudgetChange={onBudgetChange} />
                </Paper>
            );
        }
        function BudgetAdjustmentPanel({ open, onClose, budget, onBudgetChange }) {
            const [input, setInput] = React.useState(budget || '');
            React.useEffect(() => { setInput(budget || ''); }, [budget]);
            const getAdjustments = () => {
                const dayInfo = calculateDays();
                const daily = budget && dayInfo.totalDays > 0 ? budget / dayInfo.totalDays : 0;
                const base = Math.round(daily * 0.7 / 10) * 10;
                const large = Math.round(daily * 1.4 / 10) * 10;
                return { base, large };
            };
            const { base, large } = getAdjustments();
            const adjust = (delta) => {
                const newBudget = Math.max(0, (parseFloat(budget) || 0) + delta);
                onBudgetChange(newBudget);
                setInput(newBudget);
            };
            const handleInput = e => {
                setInput(e.target.value);
                const val = parseFloat(e.target.value);
                if (!isNaN(val) && val > 0) onBudgetChange(val);
            };
            return (
                <Dialog open={open} onClose={onClose} maxWidth="xs" fullWidth>
                    <DialogTitle>Adjust Budget</DialogTitle>
                    <DialogContent>
                        <Box>
                            <Stack direction="row" alignItems="center" spacing={2} mb={2}>
                                <Typography>Budget</Typography>
                                <TextField type="number" size="small" value={input} onChange={handleInput} inputProps={{min:0, step:0.01}} />
                            </Stack>
                            <Grid container spacing={1}>
                                <Grid item xs={6}><Button variant="contained" color="error" fullWidth onClick={()=>adjust(-base)}>-{base} RON</Button></Grid>
                                <Grid item xs={6}><Button variant="contained" color="success" fullWidth onClick={()=>adjust(base)}>+{base} RON</Button></Grid>
                                <Grid item xs={6}><Button variant="contained" color="error" fullWidth onClick={()=>adjust(-large)}>-{large} RON</Button></Grid>
                                <Grid item xs={6}><Button variant="contained" color="success" fullWidth onClick={()=>adjust(large)}>+{large} RON</Button></Grid>
                            </Grid>
                        </Box>
                    </DialogContent>
                    <DialogActions>
                        <Button onClick={onClose}>Close</Button>
                    </DialogActions>
                </Dialog>
            );
        }
        function TodayPanel() {
            const [hours, setHours] = React.useState(getWorkingHoursProgress());
            const [open, setOpen] = React.useState(false);
            const [earlyStart, setEarlyStart] = React.useState(() => localStorage.getItem('todayProgressStart'));
            const [breaks, setBreaks] = React.useState(() => {
                try { return JSON.parse(localStorage.getItem('todayProgressBreaks') || '[]'); } catch { return []; }
            });
            const [remaining, setRemaining] = React.useState({h: hours.hoursRemaining, m: 0});
            React.useEffect(() => {
                const update = () => {
                    setHours(getWorkingHoursProgress());
                    if (earlyStart) {
                        let totalBreakMs = 0;
                        breaks.forEach(b => { if (b.end) totalBreakMs += dateFns.differenceInMilliseconds(new Date(b.end), new Date(b.start)); });
                        const start = new Date(earlyStart);
                        const end = dateFns.addMilliseconds(dateFns.addHours(start, 8), totalBreakMs);
                        const now = new Date();
                        let ms = dateFns.differenceInMilliseconds(end, now);
                        if (ms < 0) ms = 0;
                        const h = Math.floor(ms / 3600000);
                        const m = Math.floor((ms % 3600000) / 60000);
                        setRemaining({h, m});
                    } else {
                        const h = Math.floor(hours.hoursRemaining);
                        const m = Math.round((hours.hoursRemaining - h) * 60);
                        setRemaining({h, m});
                    }
                };
                update();
                const interval = setInterval(update, 60000);
                return () => clearInterval(interval);
            }, [earlyStart, breaks, hours.hoursRemaining]);
            React.useEffect(() => {
                localStorage.setItem('todayProgressBreaks', JSON.stringify(breaks));
            }, [breaks]);
            const handleEarlyStart = () => {
                const start = new Date();
                const end = new Date(start.getTime() + 8 * 60 * 60 * 1000);
                localStorage.setItem('todayProgressStart', start.toISOString());
                localStorage.setItem('todayProgressEnd', end.toISOString());
                setEarlyStart(start.toISOString());
            };
            const handleStartBreak = () => setBreaks([...breaks, {start: new Date().toISOString()}]);
            const handleEndBreak = () => setBreaks(breaks.map((b,i,arr) => i===arr.length-1 && !b.end ? {...b, end: new Date().toISOString()} : b));
            const handleReset = () => {
                localStorage.removeItem('todayProgressStart');
                localStorage.removeItem('todayProgressEnd');
                localStorage.removeItem('todayProgressBreaks');
                setEarlyStart(null);
                setBreaks([]);
            };
            let breakDetails = '';
            breaks.forEach((b, i) => {
                if (b.end) {
                    const s = new Date(b.start), e = new Date(b.end);
                    const dur = dateFns.differenceInMilliseconds(e, s);
                    const min = Math.floor(dur/60000);
                    breakDetails += `Break ${i+1}: ${s.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: false})} - ${e.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: false})} (${min} min)\n`;
                } else {
                    const s = new Date(b.start);
                    breakDetails += `Break ${i+1}: ${s.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: false})} - ...\n`;
                }
            });
            let endTime = '18:00';
            if (earlyStart) {
                let totalBreakMs = 0;
                breaks.forEach(b => { if (b.end) totalBreakMs += dateFns.differenceInMilliseconds(new Date(b.end), new Date(b.start)); });
                const start = new Date(earlyStart);
                const end = dateFns.addMilliseconds(dateFns.addHours(start, 8), totalBreakMs);
                endTime = end.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: false});
            }
            const percent = earlyStart && remaining ? (() => {
                let totalBreakMs = 0;
                breaks.forEach(b => { if (b.end) totalBreakMs += dateFns.differenceInMilliseconds(new Date(b.end), new Date(b.start)); });
                const start = new Date(earlyStart);
                const end = dateFns.addMilliseconds(dateFns.addHours(start, 8), totalBreakMs);
                const now = new Date();
                let elapsed = dateFns.differenceInMilliseconds(now, start);
                let total = dateFns.differenceInMilliseconds(end, start);
                let percent = Math.max(0, Math.min(100, (elapsed / total) * 100));
                return Math.round(percent);
            })() : Math.round(hours.progressPercentage);
            return (
                <Paper elevation={3} sx={{p:2, mt:2, bgcolor:'#2d3561', cursor:'pointer'}} onClick={()=>{ if (!open) setOpen(true); }}>
                    <Box display="flex" justifyContent="space-between" alignItems="center" mb={1}>
                        <Box display="flex" alignItems="center" gap={1}>
                            <Typography fontWeight={600} color="#fff">Today</Typography>
                            <Typography fontWeight={600} color="#fff">{percent}%</Typography>
                        </Box>
                        <Typography fontWeight={600} color="#fff">{endTime}</Typography>
                    </Box>
                    <Box position="relative" width="100%">
                        <LinearProgress variant="determinate" value={percent} sx={{height:16, borderRadius:2, bgcolor:'#222', '& .MuiLinearProgress-bar': {background:'#20b2ff'} }} />
                        <Box position="absolute" top={0} left={0} width="100%" height="100%" display="flex" alignItems="center" justifyContent="center">
                            <Typography fontWeight={600} color="#fff" fontSize={14}>
                                {!hours.isWorkingDay
                                    ? 'Weekend - No work hours'
                                    : hours.status === 'Complete'
                                        ? 'Work day completed'
                                        : earlyStart
                                            ? `${remaining.h}h ${remaining.m}m remaining`
                                            : hours.status === 'Before hours'
                                                ? `${remaining.h}h ${remaining.m}m until end`
                                                : `${remaining.h}h ${remaining.m}m remaining`
                                }
                            </Typography>
                        </Box>
                    </Box>
                <Dialog open={open} onClose={()=>setOpen(false)} maxWidth="xs" fullWidth>
                    <DialogTitle>Today Details</DialogTitle>
                    <DialogContent>
                        <Box>
                            {!earlyStart && (new Date().getHours() < 10) ? (
                                <Box textAlign="center" my={2}>
                                    <Button variant="contained" color="success" onClick={handleEarlyStart}>Early Start</Button>
                                </Box>
                            ) : earlyStart ? (
                                <Box textAlign="center">
                                    <Typography fontWeight={600} fontSize={18} mb={1}>Start: {new Date(earlyStart).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: false})}</Typography>
                                    {breakDetails && <pre style={{color:'#e0e0e0',marginBottom:8,fontFamily:'monospace',fontSize:'1em'}}>{breakDetails}</pre>}
                                    <Grid container spacing={1} my={1}>
                                        {(!breaks.length || breaks[breaks.length-1].end) ? (
                                            <Grid item xs={6}><Button variant="contained" color="success" fullWidth onClick={handleStartBreak}>Start Break</Button></Grid>
                                        ) : (
                                            <Grid item xs={6}><Button variant="contained" color="primary" fullWidth onClick={handleEndBreak}>End Break</Button></Grid>
                                        )}
                                        <Grid item xs={6}><Button variant="contained" color="error" fullWidth onClick={handleReset}>Reset</Button></Grid>
                                    </Grid>
                                </Box>
                            ) : <Typography color="text.secondary">TBD</Typography>}
                        </Box>
                    </DialogContent>
                    <DialogActions>
                        <Button onClick={()=>setOpen(false)}>Close</Button>
                    </DialogActions>
                </Dialog>
                </Paper>
            );
        }
        function TasksPanel({ tasks, setTasks }) {
            const stats = React.useMemo(() => {
                const total = tasks.length;
                const completed = tasks.filter(t => t.completed).length;
                const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;
                return { total, completed, remaining: total - completed, percentage };
            }, [tasks]);
            const [newTask, setNewTask] = React.useState('');
            const [open, setOpen] = React.useState(false);
            const [editId, setEditId] = React.useState(null);
            const [editText, setEditText] = React.useState('');
            const addTask = () => {
                if (newTask.trim()) {
                    const task = { id: Date.now(), text: newTask.trim(), completed: false, createdAt: new Date().toISOString() };
                    setTasks([...tasks, task]);
                    setNewTask('');
                }
            };
            const toggleTask = id => setTasks(tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
            const deleteTask = id => setTasks(tasks.filter(t => t.id !== id));
            const startEdit = (id, text) => { setEditId(id); setEditText(text); };
            const saveEdit = id => {
                if (editText.trim()) setTasks(tasks.map(t => t.id === id ? { ...t, text: editText.trim() } : t));
                setEditId(null); setEditText('');
            };
            const cancelEdit = () => { setEditId(null); setEditText(''); };
            return (
                <Paper elevation={3} sx={{p:2, mt:2, bgcolor:'#2d3561', cursor:'pointer'}} onClick={()=>{ if (!open) setOpen(true); }}>
                    <Box display="flex" justifyContent="space-between" alignItems="center" mb={1}>
                        <Box display="flex" alignItems="center" gap={1}>
                            <Typography fontWeight={600} color="#fff">Tasks</Typography>
                            <Typography fontWeight={600} color="#fff">{stats.percentage}%</Typography>
                        </Box>
                        <Typography fontWeight={600} color="#fff">{stats.completed}/{stats.total}</Typography>
                    </Box>
                    <Box position="relative" width="100%">
                        <LinearProgress variant="determinate" value={stats.percentage} sx={{height:16, borderRadius:2, bgcolor:'#222', '& .MuiLinearProgress-bar': {background: stats.total > 0 && stats.completed === stats.total ? '#4caf50' : '#20b2ff'} }} />
                        <Box position="absolute" top={0} left={0} width="100%" height="100%" display="flex" alignItems="center" justifyContent="center">
                            <Typography fontWeight={600} color="#fff" fontSize={14}>
                                {stats.total === 0 ? 'No tasks • Click to manage' :
                                    stats.completed === stats.total ? 'All tasks completed!' :
                                    `${stats.remaining} tasks remaining`}
                            </Typography>
                        </Box>
                    </Box>
                    <Dialog open={open} onClose={()=>setOpen(false)} maxWidth="xs" fullWidth>
                        <DialogTitle>Tasks</DialogTitle>
                        <DialogContent>
                            <Box>
                                <Stack direction="row" spacing={1} mb={2}>
                                    <TextField fullWidth size="small" placeholder="Enter new task..." value={newTask} onChange={e => setNewTask(e.target.value)} onKeyDown={e => e.key === 'Enter' && addTask()} />
                                    <Button variant="contained" color="success" onClick={addTask}>Add</Button>
                                </Stack>
                                <Box maxHeight={180} overflow="auto">
                                    {tasks.length === 0 ? <Typography color="text.secondary" align="center">No tasks yet</Typography> :
                                        tasks.map(task => (
                                            <Box key={task.id} display="flex" alignItems="center" gap={1} mb={1} p={1} borderRadius={1} bgcolor="#232344">
                                                <Checkbox checked={task.completed} onChange={()=>toggleTask(task.id)} color="success" />
                                                {editId === task.id ? (
                                                    <TextField size="small" value={editText} autoFocus onChange={e => setEditText(e.target.value)} onBlur={()=>saveEdit(task.id)} onKeyDown={e => {if(e.key==='Enter')saveEdit(task.id);if(e.key==='Escape')cancelEdit();}} />
                                                ) : (
                                                    <Typography flex={1} color={task.completed ? 'text.disabled' : '#fff'} sx={{textDecoration: task.completed ? 'line-through' : 'none', cursor:'pointer'}} onClick={()=>startEdit(task.id, task.text)}>{task.text}</Typography>
                                                )}
                                                <IconButton size="small" color="error" onClick={()=>deleteTask(task.id)}><span className="material-icons">delete</span></IconButton>
                                            </Box>
                                        ))}
                                </Box>
                            </Box>
                        </DialogContent>
                        <DialogActions>
                            <Button onClick={()=>setOpen(false)}>Close</Button>
                        </DialogActions>
                    </Dialog>
                </Paper>
            );
        }
        function App() {
            const [budget, setBudget] = React.useState(loadBudget() || 2000);
            const [tasks, setTasks] = React.useState(loadTasks());
            React.useEffect(() => { saveBudget(budget); }, [budget]);
            React.useEffect(() => { saveTasks(tasks); }, [tasks]);
            return (
                <ThemeProvider theme={theme}>
                  <Box minHeight="100vh" bgcolor="background.default" p={2}>
                      <Paper elevation={4} sx={{maxWidth:420, mx:'auto', p:2, mt:2}}>
                          <Typography variant="h5" align="center" fontWeight={600} color="#e0e0e0" mb={2}>Progress Tracker</Typography>
                          <ProgressPanel budget={budget} onBudgetChange={setBudget} />
                          <TodayPanel />
                          <TasksPanel tasks={tasks} setTasks={setTasks} />
                      </Paper>
                  </Box>
                </ThemeProvider>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
        </script>
</body>
</html>
