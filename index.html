<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Tracker</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 8px;
            background: #1a1a2e;
            min-height: 100vh;
            font-size: 15px;
            line-height: 1.5;
        }
        .container {
            background: #232344;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        h1 {
            color: #e0e0e0;
            text-align: center;
            margin: 0 0 8px 0;
            font-weight: 600;
            font-size: 1.2em;
        }
        .header { text-align: center; margin-bottom: 10px; }
        .progress-container, .hours-progress-container, .tasks-progress-container {
            background: #2d3561;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #333;
            margin-top: 10px;
        }
        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 0.95em;
            color: #fff;
        }
        .progress-label-section {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .progress-label, .progress-percentage, .cycle-end {
            font-weight: 600;
            color: #fff;
            font-size: 0.95em;
        }
        .progress-bar-container {
            position: relative;
            width: 100%;
            height: 16px;
            background: #222;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 6px;
            border: 1px solid #333;
        }
        .progress-bar, .hours-progress-bar, .tasks-progress-bar {
            height: 100%;
            background: #20b2ff;
            border-radius: 8px;
            transition: width 0.5s ease;
        }
        .tasks-progress-bar.completed {
            background: #4caf50;
        }
        .progress-stats-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.9em;
            color: #fff;
            font-weight: 600;
        }
        .progress-text-info {
            text-align: center;
            font-weight: 600;
            font-size: 0.9em;
        }
        .task-management-panel {
            display: none;
            margin-top: 8px;
            padding: 8px;
            background: #232344;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .task-management-panel.show { display: block; }
        .add-task-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 8px;
        }
        .task-input {
            width: 100%;
            background: #232344;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-size: 1em;
            padding: 8px;
            outline: none;
        }
        .task-btn {
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            background: #4a8b6b;
            color: #fff;
        }
        .task-list {
            max-height: 120px;
            overflow-y: auto;
        }
        .task-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px;
            background: #232344;
            border-radius: 6px;
            margin-bottom: 4px;
            border: 1px solid #333;
        }
        .task-checkbox {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            border: 2px solid #4caf50;
            background: transparent;
            cursor: pointer;
            flex-shrink: 0;
            position: relative;
        }
        .task-checkbox.completed {
            background: #4caf50;
            border-color: #4caf50;
        }
        .task-checkbox.completed::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 12px;
            font-weight: bold;
        }
        .task-text {
            flex: 1;
            color: #fff;
            font-size: 1em;
            cursor: pointer;
        }
        .task-text.completed {
            text-decoration: line-through;
            color: #b0b0b0;
        }
        .task-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
            align-items: center;
        }
        .task-action-btn {
            width: 24px;
            height: 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #357abd;
            color: #fff;
        }
        .edit-btn { background: #357abd; }
        .delete-btn { background: #c0392b; }
        .empty-tasks {
            text-align: center;
            color: #b0b0b0;
            font-size: 0.95em;
            padding: 8px;
            font-style: italic;
        }
        .budget-adjustment-panel {
            display: none;
            margin-top: 8px;
            padding: 8px;
            background: #232344;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .budget-adjustment-panel.show { display: block; }
        .budget-adjustment-title {
            text-align: center;
            color: #fff;
            font-size: 1em;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .current-budget-input {
            width: 100%;
            background: #232344;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-size: 1em;
            font-weight: 600;
            padding: 8px;
            text-align: center;
            margin-bottom: 6px;
        }
        .budget-adjustment-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }
        .budget-adjust-btn {
            padding: 8px 4px;
            border: none;
            border-radius: 6px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            background: #3a5a7d;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Progress Tracker</h1>
        </div>
        
        <div class="progress-container" id="progressContainer">
            <div class="progress-header">
                <div class="progress-label-section">
                    <span class="progress-label">Progress</span>
                    <span class="progress-percentage" id="progressText">0%</span>
                </div>
                <div class="cycle-end" id="nextWorkingDayInfo">Ends: -</div>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar" style="width: 0%"></div>
                <div class="progress-stats-overlay">
                    <span class="progress-text-info" id="progressTextInfo">0 days at 0 RON/day</span>
                </div>
            </div>
            
            <!-- Budget Adjustment Panel -->
            <div class="budget-adjustment-panel" id="budgetAdjustmentPanel">
                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px; justify-content: center;">
                    <div class="budget-adjustment-title" style="margin-bottom: 0;">Buget</div>
                    <input type="number" class="current-budget-input" id="currentBudgetInput" min="0" step="0.01" placeholder="Enter budget" style="margin-bottom: 0; width: 90px; min-width: 0;">
                </div>
                <div class="budget-adjustment-buttons">
                    <button class="budget-adjust-btn decrease" id="decreaseHalf">-½ Rate</button>
                    <button class="budget-adjust-btn increase" id="increaseHalf">+½ Rate</button>
                    <button class="budget-adjust-btn decrease" id="decreaseDouble">-2x Rate</button>
                    <button class="budget-adjust-btn increase" id="increaseDouble">+2x Rate</button>
                </div>
            </div>
        </div>
        
    <div class="hours-progress-container" id="hoursProgressContainer">
            <div class="progress-header">
                <div class="progress-label-section">
                    <span class="progress-label">Today</span>
                    <span class="progress-percentage" id="hoursProgressTextHeader">0%</span>
                </div>
                <div class="cycle-end" id="workingHoursInfo">18:00</div>
            </div>
            <div class="progress-bar-container">
                <div class="hours-progress-bar" id="hoursProgressBar" style="width: 0%"></div>
                <div class="progress-stats-overlay">
                    <span class="progress-text-info" id="hoursProgressText">8h 0m remaining</span>
                </div>
            </div>
            <!-- Today Progress Panel -->
            <div class="task-management-panel" id="todayProgressPanel" style="display:none;">
                <div class="empty-tasks">TBD</div>
            </div>
        </div>
        
        <div class="tasks-progress-container" id="tasksProgressContainer">
            <div class="progress-header">
                <div class="progress-label-section">
                    <span class="progress-label">Tasks</span>
                    <span class="progress-percentage" id="tasksProgressTextHeader">0%</span>
                </div>
                <div class="cycle-end" id="tasksInfo">0/0</div>
            </div>
            <div class="progress-bar-container">
                <div class="tasks-progress-bar" id="tasksProgressBar" style="width: 0%"></div>
                <div class="progress-stats-overlay">
                    <span class="progress-text-info" id="tasksProgressText">No tasks • Click to manage</span>
                </div>
            </div>
            
            <!-- Task Management Panel -->
            <div class="task-management-panel" id="taskManagementPanel">
                <!-- Add New Task -->
                <div class="add-task-section">
                    <input type="text" class="task-input" id="newTaskInput" placeholder="Enter new task...">
                    <button class="task-btn add-task-btn" id="addTaskBtn">Add Task</button>
                </div>
                
                <!-- Task List -->
                <div class="task-list" id="taskList">
                    <!-- Tasks will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <script>
    // Utility: Month names
    const MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const SHORT_MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

        class DateCalculator {
            constructor() {}
            // Calculate working and non-working days between 10th and 25th of next month
            calculateDays() {
                const now = new Date();
                const nextMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
                const startDate = new Date(nextMonth.getFullYear(), nextMonth.getMonth(), 10);
                const endDate = new Date(nextMonth.getFullYear(), nextMonth.getMonth(), 25);
                let workingDays = 0, nonWorkingDays = 0, totalDays = 0;
                const currentDate = new Date(startDate);
                while (currentDate <= endDate) {
                    const dayOfWeek = currentDate.getDay();
                    totalDays++;
                    if (dayOfWeek === 0 || dayOfWeek === 6) nonWorkingDays++;
                    else workingDays++;
                    currentDate.setDate(currentDate.getDate() + 1);
                }
                return { workingDays, nonWorkingDays, totalDays };
            }
            getNextMonthInfo() {
                const now = new Date();
                const nextMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
                return {
                    month: MONTH_NAMES[nextMonth.getMonth()],
                    year: nextMonth.getFullYear()
                };
            }
            getNextWorkingDayInfo() {
                const now = new Date();
                const currentMonth = now.getMonth();
                const currentYear = now.getFullYear();
                const currentDate = now.getDate();
                if (currentDate < 10) {
                    const targetDate = new Date(currentYear, currentMonth, 10);
                    const nextWorkingDay = this.findNextWorkingDay(targetDate);
                    return {
                        date: nextWorkingDay,
                        monthName: MONTH_NAMES[nextWorkingDay.getMonth()],
                        isCurrentMonth: true
                    };
                } else if (currentDate <= 25) {
                    const tomorrow = new Date(now);
                    tomorrow.setDate(now.getDate() + 1);
                    const nextWorkingDay = this.findNextWorkingDay(tomorrow);
                    if (nextWorkingDay.getMonth() === currentMonth && nextWorkingDay.getDate() <= 25) {
                        return {
                            date: nextWorkingDay,
                            monthName: MONTH_NAMES[nextWorkingDay.getMonth()],
                            isCurrentMonth: true
                        };
                    } else {
                        const nextMonth = new Date(currentYear, currentMonth + 1, 10);
                        const nextWorkingDay = this.findNextWorkingDay(nextMonth);
                        return {
                            date: nextWorkingDay,
                            monthName: MONTH_NAMES[nextWorkingDay.getMonth()],
                            isCurrentMonth: false
                        };
                    }
                } else {
                    const nextMonth = new Date(currentYear, currentMonth + 1, 10);
                    const nextWorkingDay = this.findNextWorkingDay(nextMonth);
                    return {
                        date: nextWorkingDay,
                        monthName: MONTH_NAMES[nextWorkingDay.getMonth()],
                        isCurrentMonth: false
                    };
                }
            }
            findNextWorkingDay(startDate) {
                const date = new Date(startDate);
                while (date.getDay() === 0 || date.getDay() === 6) date.setDate(date.getDate() + 1);
                return date;
            }
            getProgressInfo() {
                const now = new Date();
                const currentYear = now.getFullYear();
                const currentMonth = now.getMonth();
                const currentDate = now.getDate();
                let lastCriteriaDate, nextCriteriaDate;
                if (currentDate < 10) {
                    lastCriteriaDate = new Date(currentYear, currentMonth - 1, 25, 14, 0, 0, 0);
                    nextCriteriaDate = new Date(currentYear, currentMonth, 10, 14, 0, 0, 0);
                } else if (currentDate <= 25) {
                    lastCriteriaDate = new Date(currentYear, currentMonth, 10, 14, 0, 0, 0);
                    nextCriteriaDate = new Date(currentYear, currentMonth, 25, 14, 0, 0, 0);
                } else {
                    lastCriteriaDate = new Date(currentYear, currentMonth, 25, 14, 0, 0, 0);
                    nextCriteriaDate = new Date(currentYear, currentMonth + 1, 10, 14, 0, 0, 0);
                }
                const totalHours = (nextCriteriaDate - lastCriteriaDate) / (1000 * 60 * 60);
                let hoursPassed = (now - lastCriteriaDate) / (1000 * 60 * 60);
                hoursPassed = Math.max(0, Math.min(hoursPassed, totalHours));
                const progressPercentage = Math.min(Math.max((hoursPassed / totalHours) * 100, 0), 100);
                let totalDays = 0;
                let temp = new Date(lastCriteriaDate);
                while (temp < nextCriteriaDate) { totalDays++; temp.setDate(temp.getDate() + 1); }
                let daysPassed = 0;
                temp = new Date(lastCriteriaDate);
                while (temp < now) { daysPassed++; temp.setDate(temp.getDate() + 1); }
                return {
                    lastDate: lastCriteriaDate,
                    nextDate: nextCriteriaDate,
                    daysPassed,
                    totalDays,
                    progressPercentage
                };
            }
            getWorkingHoursProgress() {
                const now = new Date();
                const currentHour = now.getHours();
                const currentMinute = now.getMinutes();
                const currentDay = now.getDay();
                const isWorkingDay = currentDay >= 1 && currentDay <= 5;
                if (!isWorkingDay) {
                    return { isWorkingDay: false, hoursElapsed: 0, hoursRemaining: 8, progressPercentage: 0, status: 'Weekend' };
                }
                const workStart = 10, workEnd = 18, totalWorkHours = workEnd - workStart;
                const currentTimeInHours = currentHour + (currentMinute / 60);
                let hoursElapsed, hoursRemaining, progressPercentage, status;
                if (currentTimeInHours < workStart) {
                    hoursElapsed = 0; hoursRemaining = totalWorkHours; progressPercentage = 0; status = 'Before hours';
                } else if (currentTimeInHours >= workEnd) {
                    hoursElapsed = totalWorkHours; hoursRemaining = 0; progressPercentage = 100; status = 'Complete';
                } else {
                    hoursElapsed = currentTimeInHours - workStart;
                    hoursRemaining = workEnd - currentTimeInHours;
                    progressPercentage = (hoursElapsed / totalWorkHours) * 100;
                    status = 'Active';
                }
                return {
                    isWorkingDay: true,
                    hoursElapsed: Math.max(0, hoursElapsed),
                    hoursRemaining: Math.max(0, hoursRemaining),
                    progressPercentage: Math.min(Math.max(progressPercentage, 0), 100),
                    status
                };
            }
        }
        
        // Single Responsibility: Handles local storage operations
        class StorageManager {
            constructor() {
                this.storageKey = 'budgetCalculator_budget';
                this.tasksStorageKey = 'progressTracker_tasks';
            }
            
            saveBudget(budget) {
                try {
                    localStorage.setItem(this.storageKey, budget.toString());
                } catch (error) {
                    console.warn('Unable to save to localStorage:', error);
                }
            }
            
            loadBudget() {
                try {
                    const savedBudget = localStorage.getItem(this.storageKey);
                    return savedBudget ? parseFloat(savedBudget) : null;
                } catch (error) {
                    console.warn('Unable to load from localStorage:', error);
                    return null;
                }
            }
            
            clearBudget() {
                try {
                    localStorage.removeItem(this.storageKey);
                } catch (error) {
                    console.warn('Unable to clear localStorage:', error);
                }
            }
            
            saveTasks(tasks) {
                try {
                    localStorage.setItem(this.tasksStorageKey, JSON.stringify(tasks));
                } catch (error) {
                    console.warn('Unable to save tasks to localStorage:', error);
                }
            }
            
            loadTasks() {
                try {
                    const savedTasks = localStorage.getItem(this.tasksStorageKey);
                    return savedTasks ? JSON.parse(savedTasks) : [];
                } catch (error) {
                    console.warn('Unable to load tasks from localStorage:', error);
                    return [];
                }
            }
            
            clearTasks() {
                try {
                    localStorage.removeItem(this.tasksStorageKey);
                } catch (error) {
                    console.warn('Unable to clear tasks from localStorage:', error);
                }
            }
        }
        
        // Task Management Class
        class TaskManager {
            constructor(storageManager) {
                this.storageManager = storageManager;
                this.tasks = [];
                this.taskIdCounter = 1;
                this.loadTasks();
            }
            
            loadTasks() {
                const savedTasks = this.storageManager.loadTasks();
                this.tasks = savedTasks;
                
                // Update counter to avoid ID conflicts
                if (this.tasks.length > 0) {
                    this.taskIdCounter = Math.max(...this.tasks.map(task => task.id)) + 1;
                }
            }
            
            saveTasks() {
                this.storageManager.saveTasks(this.tasks);
            }
            
            addTask(text) {
                if (!text || text.trim() === '') {
                    return false;
                }
                
                const task = {
                    id: this.taskIdCounter++,
                    text: text.trim(),
                    completed: false,
                    createdAt: new Date().toISOString()
                };
                
                this.tasks.push(task);
                this.saveTasks();
                return task;
            }
            
            updateTask(id, updates) {
                const taskIndex = this.tasks.findIndex(task => task.id === id);
                if (taskIndex === -1) {
                    return false;
                }
                
                this.tasks[taskIndex] = { ...this.tasks[taskIndex], ...updates };
                this.saveTasks();
                return this.tasks[taskIndex];
            }
            
            deleteTask(id) {
                const initialLength = this.tasks.length;
                this.tasks = this.tasks.filter(task => task.id !== id);
                
                if (this.tasks.length < initialLength) {
                    this.saveTasks();
                    return true;
                }
                return false;
            }
            
            toggleTask(id) {
                const task = this.tasks.find(task => task.id === id);
                if (task) {
                    task.completed = !task.completed;
                    this.saveTasks();
                    return task;
                }
                return false;
            }
            
            getTasks() {
                return [...this.tasks];
            }
            
            getTaskStats() {
                const total = this.tasks.length;
                const completed = this.tasks.filter(task => task.completed).length;
                const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;
                
                return {
                    total,
                    completed,
                    remaining: total - completed,
                    percentage
                };
            }
            
            clearAllTasks() {
                this.tasks = [];
                this.taskIdCounter = 1;
                this.saveTasks();
            }
        }
        
        // Open/Closed Principle: Open for extension, closed for modification
        class BudgetCalculator {
            constructor(dateCalculator) {
                this.dateCalculator = dateCalculator;
            }
            
            calculate(budget) {
                if (!this.isValidBudget(budget)) {
                    throw new Error('Budget must be a positive number');
                }
                
                const dayInfo = this.dateCalculator.calculateDays();
                if (dayInfo.totalDays === 0) {
                    throw new Error('No days found in the specified period');
                }
                
                return {
                    dailyBudget: budget / dayInfo.totalDays, // Use total days instead of working days
                    workingDays: dayInfo.workingDays,
                    nonWorkingDays: dayInfo.nonWorkingDays,
                    totalDays: dayInfo.totalDays,
                    totalBudget: budget
                };
            }
            
            isValidBudget(budget) {
                return budget && budget > 0 && !isNaN(budget);
            }
        }
        
        // Single Responsibility: Handles only display logic
        class DisplayManager {
            constructor(elements, dateCalculator) {
                this.elements = elements;
                this.dateCalculator = dateCalculator;
            }
            
            updateResult(calculation, monthInfo) {
                this.updateProgressBar(calculation);
                this.clearError();
            }
            
            // Generic progress bar updater
            updateProgressBar(calculation = null) {
                const progressInfo = this.dateCalculator.getProgressInfo();
                setBar(this.elements.progressBar, this.elements.progressText, progressInfo.progressPercentage);
                // Show remaining days and daily rate if budget is set
                const savedBudget = storageManager.loadBudget && storageManager.loadBudget();
                let rateInfo = '';
                const daysRemaining = progressInfo.totalDays - progressInfo.daysPassed;
                if (savedBudget && daysRemaining > 0) {
                    const dailyRate = Math.round(savedBudget / daysRemaining);
                    rateInfo = ` at ${dailyRate} RON/day`;
                }
                this.elements.progressTextInfo.textContent = `${daysRemaining} days${rateInfo}`;
                // Show budget progress end date (next working day after 10th/25th)
                let endDate = this.dateCalculator.findNextWorkingDay(progressInfo.nextDate);
                this.elements.nextWorkingDayInfo.textContent = `${SHORT_MONTH_NAMES[endDate.getMonth()]} ${endDate.getDate()}`;
                this.updateWorkingHoursProgress();
            }
            
            updateWorkingHoursProgress() {
                const hoursInfo = this.dateCalculator.getWorkingHoursProgress();
                setBar(this.elements.hoursProgressBar, this.elements.hoursProgressTextHeader, hoursInfo.progressPercentage);
                const remainingHours = Math.floor(hoursInfo.hoursRemaining);
                const remainingMinutes = Math.round((hoursInfo.hoursRemaining - remainingHours) * 60);
                if (!hoursInfo.isWorkingDay) {
                    this.elements.hoursProgressText.textContent = 'Weekend - No work hours';
                    this.elements.workingHoursInfo.textContent = 'N/A';
                } else {
                    if (hoursInfo.status === 'Complete') {
                        this.elements.hoursProgressText.textContent = 'Work day completed';
                    } else if (hoursInfo.status === 'Before hours') {
                        this.elements.hoursProgressText.textContent = `${remainingHours}h ${remainingMinutes}m until end`;
                    } else {
                        this.elements.hoursProgressText.textContent = `${remainingHours}h ${remainingMinutes}m remaining`;
                    }
                    this.elements.workingHoursInfo.textContent = `18:00 (${hoursInfo.status})`;
                }
            }
            
            updateTasksProgress(taskStats) {
                setBar(this.elements.tasksProgressBar, this.elements.tasksProgressTextHeader, taskStats.percentage);
                this.elements.tasksInfo.textContent = `${Math.round(taskStats.completed)}/${Math.round(taskStats.total)}`;
                if (taskStats.total > 0 && taskStats.completed === taskStats.total) {
                    this.elements.tasksProgressBar.classList.add('completed');
                } else {
                    this.elements.tasksProgressBar.classList.remove('completed');
                }
                if (taskStats.total === 0) {
                    this.elements.tasksProgressText.textContent = 'No tasks • Click to manage';
                } else if (taskStats.completed === taskStats.total) {
                    this.elements.tasksProgressText.textContent = 'All tasks completed!';
                } else {
                    this.elements.tasksProgressText.textContent = `${Math.round(taskStats.remaining)} tasks remaining`;
                }
            }
            
            renderTasks(tasks) {
                const taskList = this.elements.taskList;
                taskList.innerHTML = '';
                
                if (tasks.length === 0) {
                    return;
                }
                
                tasks.forEach(task => {
                    const taskElement = this.createTaskElement(task);
                    taskList.appendChild(taskElement);
                });
            }
            
            createTaskElement(task) {
                const taskItem = document.createElement('div');
                taskItem.className = 'task-item';
                taskItem.dataset.taskId = task.id;
                taskItem.innerHTML = `
                    <div class="task-checkbox ${task.completed ? 'completed' : ''}" data-action="toggle"></div>
                    <div class="task-text ${task.completed ? 'completed' : ''}" data-action="edit">${task.text}</div>
                    <div class="task-actions">
                        <button class="task-action-btn edit-btn" data-action="edit" title="Edit">✎</button>
                        <button class="task-action-btn delete-btn" data-action="delete" title="Delete">✗</button>
                    </div>
                `;
                
                return taskItem;
            }
            
            getOrdinal(n) {
                const s = ["th", "st", "nd", "rd"];
                const v = n % 100;
                return n + (s[(v - 20) % 10] || s[v] || s[0]);
            }
            
            getShortMonthName(monthIndex) {
                return SHORT_MONTH_NAMES[monthIndex];
            }
            
            showError(message) {
                this.updateProgressBar(); // Update with default values
            }
            
            clearError() {
                // No error display needed - UI is self-explanatory
            }
        }
        
        // Dependency Inversion: Depends on abstractions, not concretions
        class BudgetApp {
            constructor(calculator, displayManager, dateCalculator, storageManager, taskManager) {
                this.calculator = calculator;
                this.displayManager = displayManager;
                this.dateCalculator = dateCalculator;
                this.storageManager = storageManager;
                this.taskManager = taskManager;
                this.currentBudget = 0;
            }
            
            handleBudgetInput(budget) {
                try {
                    this.currentBudget = parseFloat(budget);
                    const calculation = this.calculator.calculate(this.currentBudget);
                    const monthInfo = this.dateCalculator.getNextMonthInfo();
                    this.displayManager.updateResult(calculation, monthInfo);
                    
                    // Save budget to localStorage
                    this.storageManager.saveBudget(budget);
                } catch (error) {
                    this.displayManager.showError(error.message);
                }
            }
            
            adjustBudget(adjustmentType) {
                if (!this.currentBudget || this.currentBudget <= 0) return;
                try {
                    const { roundedBase, roundedLarge } = getBudgetAdjustments(this.calculator, this.currentBudget);
                    let budgetAdjustment = 0;
                    switch(adjustmentType) {
                        case 'decreaseHalf': budgetAdjustment = -roundedBase; break;
                        case 'decreaseDouble': budgetAdjustment = -roundedLarge; break;
                        case 'increaseHalf': budgetAdjustment = roundedBase; break;
                        case 'increaseDouble': budgetAdjustment = roundedLarge; break;
                    }
                    const newBudget = Math.max(0, this.currentBudget + budgetAdjustment);
                    this.handleBudgetInput(newBudget);
                    elements.currentBudgetInput.value = newBudget.toFixed(0);
                    this.updateAdjustmentButtonLabels();
                } catch (error) { console.error('Error adjusting budget:', error); }
            }
            
            showBudgetAdjustment() {
                // Get the current budget from storage if currentBudget is not set
                if (!this.currentBudget || this.currentBudget <= 0) {
                    const savedBudget = this.storageManager.loadBudget();
                    if (savedBudget && savedBudget > 0) {
                        this.currentBudget = parseFloat(savedBudget);
                    }
                }
                
                // Update current budget input field
                if (this.currentBudget && this.currentBudget > 0) {
                    elements.currentBudgetInput.value = this.currentBudget.toFixed(0);
                } else {
                    // Set a default budget if none exists
                    elements.currentBudgetInput.value = '2000';
                }
                
                // Update button labels with current rate amounts
                this.updateAdjustmentButtonLabels();
                elements.budgetAdjustmentPanel.classList.add('show');
            }
            
            updateAdjustmentButtonLabels() {
                if (!this.currentBudget || this.currentBudget <= 0) return;
                try {
                    const { roundedBase, roundedLarge } = getBudgetAdjustments(this.calculator, this.currentBudget);
                    elements.decreaseHalf.textContent = `-${roundedBase} RON`;
                    elements.decreaseDouble.textContent = `-${roundedLarge} RON`;
                    elements.increaseHalf.textContent = `+${roundedBase} RON`;
                    elements.increaseDouble.textContent = `+${roundedLarge} RON`;
                } catch (error) {
                    console.error('Error updating button labels:', error);
                    elements.decreaseHalf.textContent = '-Base';
                    elements.decreaseDouble.textContent = '-Large';
                    elements.increaseHalf.textContent = '+Base';
                    elements.increaseDouble.textContent = '+Large';
                }
            }
            
            hideBudgetAdjustment() {
                elements.budgetAdjustmentPanel.classList.remove('show');
            }
            
            loadSavedBudget() {
                const savedBudget = this.storageManager.loadBudget();
                if (savedBudget && savedBudget > 0) {
                    return savedBudget;
                }
                return null;
            }
            
            // Task Management Methods
            showTaskManagement() {
                this.refreshTaskDisplay();
                elements.taskManagementPanel.classList.add('show');
            }
            
            hideTaskManagement() {
                elements.taskManagementPanel.classList.remove('show');
            }
            
            refreshTaskDisplay() {
                const tasks = this.taskManager.getTasks();
                const stats = this.taskManager.getTaskStats();
                
                this.displayManager.updateTasksProgress(stats);
                this.displayManager.renderTasks(tasks);
            }
            
            addTask() {
                const taskInput = elements.newTaskInput;
                const taskText = taskInput.value.trim();
                
                if (taskText) {
                    const task = this.taskManager.addTask(taskText);
                    if (task) {
                        taskInput.value = '';
                        this.refreshTaskDisplay();
                    }
                }
            }
            
            handleTaskAction(taskId, action) {
                switch (action) {
                    case 'toggle':
                        this.taskManager.toggleTask(parseInt(taskId));
                        this.refreshTaskDisplay();
                        break;
                    case 'delete':
                        this.taskManager.deleteTask(parseInt(taskId));
                        this.refreshTaskDisplay();
                        break;
                    case 'edit':
                        this.editTask(parseInt(taskId));
                        break;
                }
            }
            
            editTask(taskId) {
                const tasks = this.taskManager.getTasks();
                const task = tasks.find(t => t.id === taskId);
                if (!task) return;
                
                const taskElement = document.querySelector(`[data-task-id="${taskId}"]`);
                const taskTextElement = taskElement.querySelector('.task-text');
                
                // Create an input field for editing
                const input = document.createElement('input');
                input.type = 'text';
                input.value = task.text;
                input.className = 'task-text editing';
                
                // Replace the text with input
                taskTextElement.replaceWith(input);
                input.focus();
                input.select();
                
                const saveEdit = () => {
                    const newText = input.value.trim();
                    if (newText && newText !== task.text) {
                        this.taskManager.updateTask(taskId, { text: newText });
                    }
                    this.refreshTaskDisplay();
                };
                
                const cancelEdit = () => {
                    this.refreshTaskDisplay();
                };
                
                input.addEventListener('blur', saveEdit);
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        saveEdit();
                    } else if (e.key === 'Escape') {
                        e.preventDefault();
                        cancelEdit();
                    }
                });
            }
        }
        
        // Utility: Get DOM elements by id (batch)
        function getElements(ids) {
            const obj = {};
            ids.forEach(id => { obj[id] = document.getElementById(id); });
            return obj;
        }
        const elements = getElements([
            'progressContainer','progressBar','progressText','progressTextInfo','nextWorkingDayInfo',
            'hoursProgressContainer','hoursProgressBar','hoursProgressText','hoursProgressTextHeader','workingHoursInfo',
            'budgetAdjustmentPanel','currentBudgetInput','decreaseHalf','decreaseDouble','increaseHalf','increaseDouble',
            'tasksProgressContainer','tasksProgressBar','tasksProgressText','tasksProgressTextHeader','tasksInfo',
            'taskManagementPanel','newTaskInput','addTaskBtn','taskList','todayProgressPanel']
        );
        
        // --- Optimized Event and App Initialization Logic ---
        const dateCalculator = new DateCalculator();
        const budgetCalculator = new BudgetCalculator(dateCalculator);
        const storageManager = new StorageManager();
        const taskManager = new TaskManager(storageManager);
        const displayManager = new DisplayManager(elements, dateCalculator);
        const app = new BudgetApp(budgetCalculator, displayManager, dateCalculator, storageManager, taskManager);

        // Utility: Add multiple event listeners
        function addListeners(target, events, handler) {
            events.forEach(ev => target.addEventListener(ev, handler));
        }

        // --- Task Add and Action Delegation ---
        elements.addTaskBtn.addEventListener('click', e => { app.addTask(); e.stopPropagation(); });
        elements.taskList.addEventListener('click', e => {
            const action = e.target.getAttribute('data-action');
            const taskItem = e.target.closest('.task-item');
            if (action && taskItem) {
                app.handleTaskAction(taskItem.dataset.taskId, action);
                e.stopPropagation();
            }
        });

        // --- Budget/Tasks Panel Toggle ---
        let budgetPanelOpen = false, tasksPanelOpen = false, todayPanelOpen = false;
        elements.progressContainer.addEventListener('click', () => {
            budgetPanelOpen = !budgetPanelOpen;
            budgetPanelOpen ? app.showBudgetAdjustment() : app.hideBudgetAdjustment();
        });
        elements.tasksProgressContainer.addEventListener('click', () => {
            tasksPanelOpen = !tasksPanelOpen;
            tasksPanelOpen ? app.showTaskManagement() : app.hideTaskManagement();
        });

        // --- Budget Adjustment Buttons ---
        [
            ['decreaseHalf','decreaseHalf'],['decreaseDouble','decreaseDouble'],
            ['increaseHalf','increaseHalf'],['increaseDouble','increaseDouble']
        ].forEach(([id, type]) => {
            elements[id].addEventListener('click', e => app.adjustBudget(type));
        });

        // --- Progress Bar Mouse Events (hover, move, click) ---
        const progressSections = [
            {el: elements.progressContainer, update: () => displayManager.updateProgressBar()},
            {el: elements.tasksProgressContainer, update: () => displayManager.updateTasksProgress(taskManager.getTaskStats())},
            {el: elements.hoursProgressContainer, update: () => displayManager.updateWorkingHoursProgress()}
        ];
        ['mousemove','mouseenter','mouseleave','click'].forEach(eventType => {
            progressSections.forEach(({el, update}) => el.addEventListener(eventType, update));
        });
        // Mouseover effect for all progress containers
        [elements.progressContainer, elements.tasksProgressContainer, elements.hoursProgressContainer].forEach(el => {
            addListeners(el, ['mouseenter','mouseleave'], evt => {
                el.style.boxShadow = evt.type==='mouseenter' ? '0 0 0 3px #20b2ff55' : '';
            });
        });

        // --- Today Progress Panel logic (Early Start, Breaks) ---
        elements.hoursProgressContainer.addEventListener('click', e => {
            todayPanelOpen = !todayPanelOpen;
            if (todayPanelOpen) {
                const now = new Date();
                const savedStart = localStorage.getItem('todayProgressStart');
                if (now.getHours() < 10 && !savedStart) {
                    elements.todayProgressPanel.innerHTML = `
                        <div style="text-align:center;">
                            <button id="earlyStartBtn" style="padding:12px 24px;font-size:1em;border-radius:8px;background:linear-gradient(135deg,#20b2ff,#4ac3ff);color:white;border:none;cursor:pointer;font-weight:600;box-shadow:0 2px 8px #20b2ff44;">Early Start</button>
                        </div>
                    `;
                    document.getElementById('earlyStartBtn').onclick = function() {
                        const start = new Date();
                        const end = new Date(start.getTime() + 8 * 60 * 60 * 1000);
                        localStorage.setItem('todayProgressStart', start.toISOString());
                        localStorage.setItem('todayProgressEnd', end.toISOString());
                        updateTodayProgressPanel();
                    };
                } else {
                    updateTodayProgressPanel();
                }
                elements.todayProgressPanel.style.display = 'block';
            } else {
                elements.todayProgressPanel.style.display = 'none';
            }
            e.stopPropagation();
        });

        function updateTodayProgressPanel() {
            const startStr = localStorage.getItem('todayProgressStart');
            let breaks = [];
            try { breaks = JSON.parse(localStorage.getItem('todayProgressBreaks') || '[]'); } catch (e) { breaks = []; }
            if (startStr) {
                const start = new Date(startStr);
                let totalBreakMs = 0, breakDetails = '';
                breaks.forEach((b, i) => {
                    if (b.end) {
                        const s = new Date(b.start), e = new Date(b.end), dur = e - s;
                        totalBreakMs += dur;
                        const min = Math.floor(dur/60000);
                        breakDetails += `<div style=\"color:#fff;\">Break ${i+1}: ${s.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: false})} - ${e.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: false})} (${min} min)</div>`;
                    } else {
                        const s = new Date(b.start);
                        breakDetails += `<div style=\"color:#fff;\">Break ${i+1}: ${s.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: false})} - ...</div>`;
                    }
                });
                const end = new Date(start.getTime() + 8*60*60*1000 + totalBreakMs);
                let html = `<div style=\"text-align:center;\">`;
                html += `<div style=\"color:#fff;font-weight:600;font-size:1.1em;margin-bottom:12px;\">Start: ${start.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: false})}</div>`;
                if (breakDetails) html += `<div style=\"margin-bottom:8px;\">${breakDetails}</div>`;
                html += `<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px;justify-items:stretch;align-items:center;margin:8px 0;\">`;
                const ongoingBreak = breaks.length && !breaks[breaks.length-1].end;
                if (!ongoingBreak) {
                    html += `<button id=\"startBreakBtn\" class=\"budget-adjust-btn decrease\">Start Break</button>`;
                    html += `<button id=\"resetTodayProgress\" class=\"budget-adjust-btn increase\">Reset</button>`;
                } else {
                    html += `<button id=\"endBreakBtn\" class=\"budget-adjust-btn increase\">End Break</button>`;
                    html += `<button id=\"resetTodayProgress\" class=\"budget-adjust-btn increase\">Reset</button>`;
                }
                html += `</div></div>`;
                elements.todayProgressPanel.innerHTML = html;
                if (!ongoingBreak) {
                    document.getElementById('startBreakBtn').onclick = function() {
                        breaks.push({start: new Date().toISOString()});
                        localStorage.setItem('todayProgressBreaks', JSON.stringify(breaks));
                        updateTodayProgressPanel();
                    };
                } else {
                    document.getElementById('endBreakBtn').onclick = function() {
                        breaks[breaks.length-1].end = new Date().toISOString();
                        localStorage.setItem('todayProgressBreaks', JSON.stringify(breaks));
                        updateTodayProgressPanel();
                    };
                }
                document.getElementById('resetTodayProgress').onclick = function() {
                    localStorage.removeItem('todayProgressStart');
                    localStorage.removeItem('todayProgressEnd');
                    localStorage.removeItem('todayProgressBreaks');
                    updateTodayProgressPanel();
                };
                localStorage.setItem('todayProgressEnd', end.toISOString());
            } else {
                elements.todayProgressPanel.innerHTML = `<div class=\"empty-tasks\">TBD</div>`;
            }
        }

        // Patch working hours info and progress bar to use custom start/end time if set
        const origUpdateWorkingHoursProgress = displayManager.updateWorkingHoursProgress.bind(displayManager);
        displayManager.updateWorkingHoursProgress = function() {
            const startStr = localStorage.getItem('todayProgressStart');
            const endStr = localStorage.getItem('todayProgressEnd');
            if (startStr && endStr) {
                const start = new Date(startStr), end = new Date(endStr), now = new Date();
                let elapsed = (now - start) / 1000, total = (end - start) / 1000;
                let percent = Math.max(0, Math.min(100, (elapsed / total) * 100));
                elements.hoursProgressBar.style.width = percent + '%';
                elements.hoursProgressTextHeader.textContent = Math.round(percent) + '%';
                let remaining = Math.max(0, total - elapsed);
                let rh = Math.floor(remaining / 3600), rm = Math.floor((remaining % 3600) / 60);
                elements.hoursProgressText.textContent = `${rh}h ${rm}m remaining`;
                elements.workingHoursInfo.textContent = `${end.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: false})}`;
            } else {
                origUpdateWorkingHoursProgress();
            }
        };

        // --- Close panels when clicking outside ---
        document.addEventListener('click', e => {
            // Today panel
            const isClickInsideTodayPanel = elements.todayProgressPanel.contains(e.target);
            const isClickOnTodayContainer = elements.hoursProgressContainer.contains(e.target);
            if (todayPanelOpen && !isClickInsideTodayPanel && !isClickOnTodayContainer) {
                elements.todayProgressPanel.style.display = 'none';
                todayPanelOpen = false;
            }
            // Task/Budget panels
            const isTaskPanelVisible = elements.taskManagementPanel.classList.contains('show');
            const isBudgetPanelVisible = elements.budgetAdjustmentPanel.classList.contains('show');
            if (isTaskPanelVisible && !elements.taskManagementPanel.contains(e.target) && !elements.tasksProgressContainer.contains(e.target)) {
                app.hideTaskManagement(); tasksPanelOpen = false;
            }
            if (isBudgetPanelVisible && !elements.budgetAdjustmentPanel.contains(e.target) && !elements.progressContainer.contains(e.target)) {
                app.hideBudgetAdjustment(); budgetPanelOpen = false;
            }
        });
        // Prevent panel clicks from propagating
        [elements.taskManagementPanel, elements.budgetAdjustmentPanel].forEach(panel => {
            panel.addEventListener('click', e => e.stopPropagation());
        });

        // --- Helper: set progress bar width and text ---
        function setBar(barEl, textEl, percent) {
            barEl.style.width = `${percent}%`;
            textEl.textContent = `${Math.round(percent)}%`;
        }
        // --- Helper: get budget adjustment values ---
        function getBudgetAdjustments(calculator, currentBudget) {
            const calculation = calculator.calculate(currentBudget);
            const dailyRate = calculation.dailyBudget;
            const baseAdjustment = Math.round(dailyRate * 0.7);
            const largeAdjustment = Math.round(dailyRate * 1.4);
            const roundedBase = Math.round(baseAdjustment / 10) * 10;
            const roundedLarge = Math.round(largeAdjustment / 10) * 10;
            return { roundedBase, roundedLarge };
        }

        // --- App Initialization ---
        function initializeApp() {
            try {
                const savedBudget = app.loadSavedBudget();
                if (savedBudget) app.handleBudgetInput(savedBudget);
                else displayManager.updateProgressBar();
                app.refreshTaskDisplay();
                setInterval(() => {
                    try { displayManager.updateWorkingHoursProgress(); } catch (error) { console.error('Error updating working hours:', error); }
                }, 60000);
                console.log('✓ Progress Tracker initialized successfully');
            } catch (error) {
                console.error('✗ Initialization failed:', error);
                try { displayManager.showError('Initialization error - please refresh'); } catch (fallbackError) { console.error('✗ Critical error - unable to show UI:', fallbackError); }
            }
        }
        initializeApp();
    </script>
</body>
</html>
