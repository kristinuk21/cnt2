<body>
    <div class="container">
        <h1>Budget Calculator</h1>
        
        <div class="input-group">
            <label for="budget">Total Budget (RON)</label>
            <input type="number" id="budget" min="0" step="0.01" placeholder="Enter your total budget in RON">
            <div class="storage-indicator" id="storageIndicator">✓ Budget saved automatically</div>
            <button class="clear-button" id="clearButton" style="display: none;">Clear Saved Budget</button>
        </div>
        
        <div class="result" id="result">
            <div class="info" id="info">Enter your budget to see daily spending limit</div>
            
            <div class="progress-container" id="progressContainer">
                <div class="progress-header">
                    <div class="progress-label" id="progressLabel">Budget Cycle Progress</div>
                    <div class="progress-stats">
                        <div class="progress-stat">
                            <span class="progress-stat-number" id="totalDaysProgress">0</span>
                            <span class="progress-stat-label">Total Days</span>
                        </div>
                        <div class="progress-stat">
                            <span class="progress-stat-number" id="workingDaysProgress">0</span>
                            <span class="progress-stat-label">Working Days</span>
                        </div>
                        <div class="progress-stat">
                            <span class="progress-stat-number" id="nonWorkingDaysProgress">0</span>
                            <span class="progress-stat-label">Weekends</span>
                        </div>
                    </div>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progressBar" style="width: 0%"></div>
                    <div class="progress-text" id="progressText">0%</div>
                </div>
                <div class="budget-rate" id="dailyBudget">Budget Rate: 0 RON/day</div>
                <div class="next-working-day" id="nextWorkingDayInfo">Next working day: -</div>
                
                <!-- Budget Adjustment Panel -->
                <div class="budget-adjustment-panel" id="budgetAdjustmentPanel">
                    <div class="budget-adjustment-title">Adjust Budget</div>
                    <div class="budget-adjustment-buttons">
                        <button class="budget-adjust-btn decrease" id="decreaseHalf">-½ Rate</button>
                        <button class="budget-adjust-btn decrease" id="decreaseDouble">-2x Rate</button>
                        <button class="budget-adjust-btn increase" id="increaseHalf">+½ Rate</button>
                        <button class="budget-adjust-btn increase" id="increaseDouble">+2x Rate</button>
                    </div>
                    <button class="budget-adjustment-close" id="closeBudgetAdjustment">Close</button>
                </div>
            </div>
            
            <div class="hours-progress-container" id="hoursProgressContainer">
                <div class="hours-progress-header">
                    <div class="hours-progress-label" id="hoursProgressLabel">Today's Working Hours</div>
                    <div class="hours-progress-stats">
                        <div class="hours-progress-stat">
                            <span class="hours-progress-stat-number" id="hoursElapsed">0</span>
                            <span class="hours-progress-stat-label">Elapsed</span>
                        </div>
                        <div class="hours-progress-stat">
                            <span class="hours-progress-stat-number" id="hoursRemaining">8</span>
                            <span class="hours-progress-stat-label">Remaining</span>
                        </div>
                    </div>
                </div>
                <div class="hours-progress-bar-container">
                    <div class="hours-progress-bar" id="hoursProgressBar" style="width: 0%"></div>
                    <div class="hours-progress-text" id="hoursProgressText">0%</div>
                </div>
            </div>
            
        </div>
    </div>

    <script>
        // Single Responsibility Principle: Each class has one specific purpose
        class DateCalculator {
            constructor() {}
            
            // Calculate working and non-working days between 10th and 25th of next month
            calculateDays() {
                const now = new Date();
                const nextMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
                const startDate = new Date(nextMonth.getFullYear(), nextMonth.getMonth(), 10);
                const endDate = new Date(nextMonth.getFullYear(), nextMonth.getMonth(), 25);
                
                let workingDays = 0;
                let nonWorkingDays = 0;
                let totalDays = 0;
                const currentDate = new Date(startDate);
                
                while (currentDate <= endDate) {
                    const dayOfWeek = currentDate.getDay();
                    totalDays++;
                    
                    // Check if it's a weekend (0 = Sunday, 6 = Saturday)
                    if (dayOfWeek === 0 || dayOfWeek === 6) {
                        nonWorkingDays++;
                    } else {
                        workingDays++;
                    }
                    currentDate.setDate(currentDate.getDate() + 1);
                }
                
                return {
                    workingDays,
                    nonWorkingDays,
                    totalDays
                };
            }
            
            // Legacy method for backward compatibility
            calculateWorkingDays() {
                return this.calculateDays().workingDays;
            }
            
            getNextMonthInfo() {
                const now = new Date();
                const nextMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
                const monthNames = [
                    "January", "February", "March", "April", "May", "June",
                    "July", "August", "September", "October", "November", "December"
                ];
                return {
                    month: monthNames[nextMonth.getMonth()],
                    year: nextMonth.getFullYear()
                };
            }
            
            getNextWorkingDayInfo() {
                const now = new Date();
                const currentMonth = now.getMonth();
                const currentYear = now.getFullYear();
                const currentDate = now.getDate();
                
                // Check if we're before the 10th of current month
                if (currentDate < 10) {
                    // Find next working day on or after 10th of current month
                    const targetDate = new Date(currentYear, currentMonth, 10);
                    const nextWorkingDay = this.findNextWorkingDay(targetDate);
                    return {
                        date: nextWorkingDay,
                        monthName: this.getMonthName(nextWorkingDay.getMonth()),
                        isCurrentMonth: true
                    };
                } else if (currentDate <= 25) {
                    // We're between 10th and 25th - find next working day from today
                    const tomorrow = new Date(now);
                    tomorrow.setDate(now.getDate() + 1);
                    const nextWorkingDay = this.findNextWorkingDay(tomorrow);
                    
                    // Check if next working day is still within the 25th of current month
                    if (nextWorkingDay.getMonth() === currentMonth && nextWorkingDay.getDate() <= 25) {
                        return {
                            date: nextWorkingDay,
                            monthName: this.getMonthName(nextWorkingDay.getMonth()),
                            isCurrentMonth: true
                        };
                    } else {
                        // Next working day is past 25th, so show 10th of next month
                        const nextMonth = new Date(currentYear, currentMonth + 1, 10);
                        const nextWorkingDay = this.findNextWorkingDay(nextMonth);
                        return {
                            date: nextWorkingDay,
                            monthName: this.getMonthName(nextWorkingDay.getMonth()),
                            isCurrentMonth: false
                        };
                    }
                } else {
                    // We're past 25th - find next working day on or after 10th of next month
                    const nextMonth = new Date(currentYear, currentMonth + 1, 10);
                    const nextWorkingDay = this.findNextWorkingDay(nextMonth);
                    return {
                        date: nextWorkingDay,
                        monthName: this.getMonthName(nextWorkingDay.getMonth()),
                        isCurrentMonth: false
                    };
                }
            }
            
            findNextWorkingDay(startDate) {
                const date = new Date(startDate);
                while (date.getDay() === 0 || date.getDay() === 6) { // Skip weekends
                    date.setDate(date.getDate() + 1);
                }
                return date;
            }
            
            getProgressInfo() {
                const now = new Date();
                const currentYear = now.getFullYear();
                const currentMonth = now.getMonth();
                const currentDate = now.getDate();
                
                let lastCriteriaDate, nextCriteriaDate;
                
                // Determine last and next criteria dates (10th or 25th)
                if (currentDate < 10) {
                    // Before 10th of current month
                    lastCriteriaDate = new Date(currentYear, currentMonth - 1, 25); // 25th of previous month
                    nextCriteriaDate = new Date(currentYear, currentMonth, 10); // 10th of current month
                } else if (currentDate <= 25) {
                    // Between 10th and 25th of current month
                    lastCriteriaDate = new Date(currentYear, currentMonth, 10); // 10th of current month
                    nextCriteriaDate = new Date(currentYear, currentMonth, 25); // 25th of current month
                } else {
                    // After 25th of current month
                    lastCriteriaDate = new Date(currentYear, currentMonth, 25); // 25th of current month
                    nextCriteriaDate = new Date(currentYear, currentMonth + 1, 10); // 10th of next month
                }
                
                // Calculate progress
                const totalDays = Math.ceil((nextCriteriaDate - lastCriteriaDate) / (1000 * 60 * 60 * 24));
                const daysPassed = Math.ceil((now - lastCriteriaDate) / (1000 * 60 * 60 * 24));
                const progressPercentage = Math.min(Math.max((daysPassed / totalDays) * 100, 0), 100);
                
                return {
                    lastDate: lastCriteriaDate,
                    nextDate: nextCriteriaDate,
                    daysPassed: Math.max(daysPassed, 0),
                    totalDays: totalDays,
                    progressPercentage: progressPercentage
                };
            }
            
            getWorkingHoursProgress() {
                const now = new Date();
                const currentHour = now.getHours();
                const currentMinute = now.getMinutes();
                const currentDay = now.getDay(); // 0 = Sunday, 6 = Saturday
                
                // Check if it's a working day (Monday-Friday)
                const isWorkingDay = currentDay >= 1 && currentDay <= 5;
                
                if (!isWorkingDay) {
                    return {
                        isWorkingDay: false,
                        hoursElapsed: 0,
                        hoursRemaining: 8,
                        progressPercentage: 0,
                        status: 'Weekend'
                    };
                }
                
                const workStart = 10; // 10:00 AM
                const workEnd = 18;   // 6:00 PM
                const totalWorkHours = workEnd - workStart; // 8 hours
                
                const currentTimeInHours = currentHour + (currentMinute / 60);
                
                let hoursElapsed, hoursRemaining, progressPercentage, status;
                
                if (currentTimeInHours < workStart) {
                    // Before work hours
                    hoursElapsed = 0;
                    hoursRemaining = totalWorkHours;
                    progressPercentage = 0;
                    status = 'Before work hours';
                } else if (currentTimeInHours >= workEnd) {
                    // After work hours
                    hoursElapsed = totalWorkHours;
                    hoursRemaining = 0;
                    progressPercentage = 100;
                    status = 'Work day complete';
                } else {
                    // During work hours
                    hoursElapsed = currentTimeInHours - workStart;
                    hoursRemaining = workEnd - currentTimeInHours;
                    progressPercentage = (hoursElapsed / totalWorkHours) * 100;
                    status = 'In progress';
                }
                
                return {
                    isWorkingDay: true,
                    hoursElapsed: Math.max(0, hoursElapsed),
                    hoursRemaining: Math.max(0, hoursRemaining),
                    progressPercentage: Math.min(Math.max(progressPercentage, 0), 100),
                    status: status
                };
            }
            
            getMonthName(monthIndex) {
                const monthNames = [
                    "January", "February", "March", "April", "May", "June",
                    "July", "August", "September", "October", "November", "December"
                ];
                return monthNames[monthIndex];
            }
        }
        
        // Single Responsibility: Handles local storage operations
        class StorageManager {
            constructor() {
                this.storageKey = 'budgetCalculator_budget';
            }
            
            saveBudget(budget) {
                try {
                    localStorage.setItem(this.storageKey, budget.toString());
                } catch (error) {
                    console.warn('Unable to save to localStorage:', error);
                }
            }
            
            loadBudget() {
                try {
                    const savedBudget = localStorage.getItem(this.storageKey);
                    return savedBudget ? parseFloat(savedBudget) : null;
                } catch (error) {
                    console.warn('Unable to load from localStorage:', error);
                    return null;
                }
            }
            
            clearBudget() {
                try {
                    localStorage.removeItem(this.storageKey);
                } catch (error) {
                    console.warn('Unable to clear localStorage:', error);
                }
            }
        }
        
        // Open/Closed Principle: Open for extension, closed for modification
        class BudgetCalculator {
            constructor(dateCalculator) {
                this.dateCalculator = dateCalculator;
            }
            
            calculate(budget) {
                if (!this.isValidBudget(budget)) {
                    throw new Error('Budget must be a positive number');
                }
                
                const dayInfo = this.dateCalculator.calculateDays();
                if (dayInfo.totalDays === 0) {
                    throw new Error('No days found in the specified period');
                }
                
                return {
                    dailyBudget: budget / dayInfo.totalDays, // Use total days instead of working days
                    workingDays: dayInfo.workingDays,
                    nonWorkingDays: dayInfo.nonWorkingDays,
                    totalDays: dayInfo.totalDays,
                    totalBudget: budget
                };
            }
            
            isValidBudget(budget) {
                return budget && budget > 0 && !isNaN(budget);
            }
        }
        
        // Single Responsibility: Handles only display logic
        class DisplayManager {
            constructor(elements, dateCalculator) {
                this.elements = elements;
                this.dateCalculator = dateCalculator;
            }
            
            updateResult(calculation, monthInfo) {
                this.elements.dailyBudget.textContent = `Budget Rate: ${calculation.dailyBudget.toFixed(2)} RON/day`;
                this.elements.info.textContent = `Daily budget calculated`;
                
                // Update progress bar with all information consolidated
                this.updateProgressBar(calculation);
                
                this.clearError();
            }
            
            updateProgressBar(calculation = null) {
                const progressInfo = this.dateCalculator.getProgressInfo();
                
                // Update progress bar
                this.elements.progressBar.style.width = `${progressInfo.progressPercentage}%`;
                this.elements.progressText.textContent = `${Math.round(progressInfo.progressPercentage)}%`;
                
                // Simplified progress label without duplicate day counts
                this.elements.progressLabel.textContent = `Budget Cycle Progress`;
                
                // Update consolidated stats
                if (calculation) {
                    this.elements.totalDaysProgress.textContent = calculation.totalDays;
                    this.elements.workingDaysProgress.textContent = calculation.workingDays;
                    this.elements.nonWorkingDaysProgress.textContent = calculation.nonWorkingDays;
                } else {
                    // Default values when no calculation is available
                    const defaultDayInfo = this.dateCalculator.calculateDays();
                    this.elements.totalDaysProgress.textContent = defaultDayInfo.totalDays;
                    this.elements.workingDaysProgress.textContent = defaultDayInfo.workingDays;
                    this.elements.nonWorkingDaysProgress.textContent = defaultDayInfo.nonWorkingDays;
                }
                
                // Show budget progress end date instead of next working day
                const endDateInfo = this.dateCalculator.getProgressInfo();
                const endDate = endDateInfo.nextDate;
                const endDayName = endDate.toLocaleDateString('en-US', { weekday: 'long' });
                this.elements.nextWorkingDayInfo.textContent = 
                    `Budget cycle ends: ${endDayName}, ${this.getShortMonthName(endDate.getMonth())} ${endDate.getDate()}`;
                
                // Update working hours progress
                this.updateWorkingHoursProgress();
            }
            
            updateWorkingHoursProgress() {
                const hoursInfo = this.dateCalculator.getWorkingHoursProgress();
                
                // Update hours progress bar
                this.elements.hoursProgressBar.style.width = `${hoursInfo.progressPercentage}%`;
                this.elements.hoursProgressText.textContent = `${Math.round(hoursInfo.progressPercentage)}%`;
                
                // Update hours stats
                this.elements.hoursElapsed.textContent = hoursInfo.hoursElapsed.toFixed(1);
                this.elements.hoursRemaining.textContent = hoursInfo.hoursRemaining.toFixed(1);
                
                // Update label based on status
                if (!hoursInfo.isWorkingDay) {
                    this.elements.hoursProgressLabel.textContent = 'Weekend - No Work Hours';
                    this.elements.hoursElapsed.textContent = '-';
                    this.elements.hoursRemaining.textContent = '-';
                } else {
                    this.elements.hoursProgressLabel.textContent = `Today's Working Hours (${hoursInfo.status})`;
                }
            }
            
            getOrdinal(n) {
                const s = ["th", "st", "nd", "rd"];
                const v = n % 100;
                return n + (s[(v - 20) % 10] || s[v] || s[0]);
            }
            
            getShortMonthName(monthIndex) {
                const shortMonthNames = [
                    "Jan", "Feb", "Mar", "Apr", "May", "Jun",
                    "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"
                ];
                return shortMonthNames[monthIndex];
            }
            
            showError(message) {
                this.elements.dailyBudget.textContent = '0 RON';
                this.elements.info.innerHTML = `<span class="error">${message}</span>`;
                this.elements.dayBreakdown.style.display = 'none';
            }
            
            clearError() {
                const errorElements = this.elements.info.querySelectorAll('.error');
                errorElements.forEach(el => el.remove());
            }
        }
        
        // Dependency Inversion: Depends on abstractions, not concretions
        class BudgetApp {
            constructor(calculator, displayManager, dateCalculator, storageManager) {
                this.calculator = calculator;
                this.displayManager = displayManager;
                this.dateCalculator = dateCalculator;
                this.storageManager = storageManager;
                this.currentBudget = 0;
            }
            
            handleBudgetInput(budget) {
                try {
                    this.currentBudget = parseFloat(budget);
                    const calculation = this.calculator.calculate(this.currentBudget);
                    const monthInfo = this.dateCalculator.getNextMonthInfo();
                    this.displayManager.updateResult(calculation, monthInfo);
                    
                    // Save budget to localStorage
                    this.storageManager.saveBudget(budget);
                    this.showStorageIndicator();
                    
                    // Hide the input group after budget is set
                    this.hideInputGroup();
                } catch (error) {
                    this.displayManager.showError(error.message);
                }
            }
            
            hideInputGroup() {
                const inputGroup = document.querySelector('.input-group');
                inputGroup.classList.add('hidden');
            }
            
            showInputGroup() {
                const inputGroup = document.querySelector('.input-group');
                inputGroup.classList.remove('hidden');
            }
            
            adjustBudget(adjustmentType) {
                if (!this.currentBudget || this.currentBudget <= 0) {
                    return;
                }
                
                // Calculate current daily rate
                try {
                    const calculation = this.calculator.calculate(this.currentBudget);
                    const dailyRate = calculation.dailyBudget;
                    const totalDays = calculation.totalDays;
                    
                    let rateAdjustment = 0;
                    
                    switch(adjustmentType) {
                        case 'decreaseHalf':
                            rateAdjustment = -dailyRate * 0.5; // Decrease by half the daily rate
                            break;
                        case 'decreaseDouble':
                            rateAdjustment = -dailyRate * 2; // Decrease by double the daily rate
                            break;
                        case 'increaseHalf':
                            rateAdjustment = dailyRate * 0.5; // Increase by half the daily rate
                            break;
                        case 'increaseDouble':
                            rateAdjustment = dailyRate * 2; // Increase by double the daily rate
                            break;
                    }
                    
                    // Calculate new total budget based on rate adjustment
                    const newDailyRate = dailyRate + rateAdjustment;
                    const newBudget = Math.max(0, newDailyRate * totalDays); // Use total days for budget calculation
                    
                    // Update the input field and recalculate
                    elements.budget.value = newBudget.toFixed(2);
                    this.handleBudgetInput(newBudget);
                    
                } catch (error) {
                    console.error('Error adjusting budget:', error);
                }
                
                // Hide the adjustment panel
                this.hideBudgetAdjustment();
            }
            
            showBudgetAdjustment() {
                // Update button labels with current rate amounts
                this.updateAdjustmentButtonLabels();
                elements.budgetAdjustmentPanel.classList.add('show');
            }
            
            updateAdjustmentButtonLabels() {
                if (!this.currentBudget || this.currentBudget <= 0) {
                    return;
                }
                
                try {
                    const calculation = this.calculator.calculate(this.currentBudget);
                    const dailyRate = calculation.dailyBudget;
                    
                    // Calculate the daily rate adjustments (not total budget adjustments)
                    const halfRate = (dailyRate * 0.5).toFixed(0);
                    const doubleRate = (dailyRate * 2).toFixed(0);
                    
                    // Update button labels with daily rate changes
                    elements.decreaseHalf.textContent = `-${halfRate} RON/day`;
                    elements.decreaseDouble.textContent = `-${doubleRate} RON/day`;
                    elements.increaseHalf.textContent = `+${halfRate} RON/day`;
                    elements.increaseDouble.textContent = `+${doubleRate} RON/day`;
                    
                } catch (error) {
                    console.error('Error updating button labels:', error);
                    // Fallback labels
                    elements.decreaseHalf.textContent = '-½ Rate';
                    elements.decreaseDouble.textContent = '-2x Rate';
                    elements.increaseHalf.textContent = '+½ Rate';
                    elements.increaseDouble.textContent = '+2x Rate';
                }
            }
            
            hideBudgetAdjustment() {
                elements.budgetAdjustmentPanel.classList.remove('show');
            }
            
            showStorageIndicator() {
                const indicator = document.getElementById('storageIndicator');
                const clearButton = document.getElementById('clearButton');
                
                indicator.classList.add('show');
                clearButton.style.display = 'inline-block';
                
                // Hide indicator after 2 seconds
                setTimeout(() => {
                    indicator.classList.remove('show');
                }, 2000);
            }
            
            clearSavedBudget() {
                this.storageManager.clearBudget();
                const budgetInput = document.getElementById('budget');
                const clearButton = document.getElementById('clearButton');
                
                budgetInput.value = '';
                clearButton.style.display = 'none';
                this.currentBudget = 0;
                this.hideBudgetAdjustment();
                
                // Show the input group again
                this.showInputGroup();
                
                this.displayManager.showError('Enter your budget to see daily spending limit');
            }
            
            loadSavedBudget() {
                const savedBudget = this.storageManager.loadBudget();
                if (savedBudget && savedBudget > 0) {
                    return savedBudget;
                }
                return null;
            }
        }
        
        // Interface Segregation: Small, focused interfaces
        const elements = {
            budget: document.getElementById('budget'),
            dailyBudget: document.getElementById('dailyBudget'),
            info: document.getElementById('info'),
            storageIndicator: document.getElementById('storageIndicator'),
            clearButton: document.getElementById('clearButton'),
            progressContainer: document.getElementById('progressContainer'),
            progressBar: document.getElementById('progressBar'),
            progressText: document.getElementById('progressText'),
            progressLabel: document.getElementById('progressLabel'),
            totalDaysProgress: document.getElementById('totalDaysProgress'),
            workingDaysProgress: document.getElementById('workingDaysProgress'),
            nonWorkingDaysProgress: document.getElementById('nonWorkingDaysProgress'),
            nextWorkingDayInfo: document.getElementById('nextWorkingDayInfo'),
            hoursProgressContainer: document.getElementById('hoursProgressContainer'),
            hoursProgressBar: document.getElementById('hoursProgressBar'),
            hoursProgressText: document.getElementById('hoursProgressText'),
            hoursProgressLabel: document.getElementById('hoursProgressLabel'),
            hoursElapsed: document.getElementById('hoursElapsed'),
            hoursRemaining: document.getElementById('hoursRemaining'),
            budgetAdjustmentPanel: document.getElementById('budgetAdjustmentPanel'),
            decreaseHalf: document.getElementById('decreaseHalf'),
            decreaseDouble: document.getElementById('decreaseDouble'),
            increaseHalf: document.getElementById('increaseHalf'),
            increaseDouble: document.getElementById('increaseDouble'),
            closeBudgetAdjustment: document.getElementById('closeBudgetAdjustment')
        };
        
        // Dependency Injection: Inject dependencies
        const dateCalculator = new DateCalculator();
        const budgetCalculator = new BudgetCalculator(dateCalculator);
        const displayManager = new DisplayManager(elements, dateCalculator);
        const storageManager = new StorageManager();
        const app = new BudgetApp(budgetCalculator, displayManager, dateCalculator, storageManager);
        
        // Event handling
        elements.budget.addEventListener('input', (e) => {
            const budgetValue = e.target.value;
            if (budgetValue) {
                app.handleBudgetInput(budgetValue);
            } else {
                displayManager.showError('Enter your budget to see daily spending limit');
            }
        });
        
        // Load saved budget on page load
        const savedBudget = app.loadSavedBudget();
        if (savedBudget) {
            elements.budget.value = savedBudget;
            elements.clearButton.style.display = 'inline-block';
            app.handleBudgetInput(savedBudget);
        }
        
        // Clear button event handler
        elements.clearButton.addEventListener('click', () => {
            app.clearSavedBudget();
        });
        
        // Budget progress container click handler
        elements.progressContainer.addEventListener('click', () => {
            if (app.currentBudget > 0) {
                app.showBudgetAdjustment();
            }
        });
        
        // Budget adjustment button handlers
        elements.decreaseHalf.addEventListener('click', () => {
            app.adjustBudget('decreaseHalf');
        });
        
        elements.decreaseDouble.addEventListener('click', () => {
            app.adjustBudget('decreaseDouble');
        });
        
        elements.increaseHalf.addEventListener('click', () => {
            app.adjustBudget('increaseHalf');
        });
        
        elements.increaseDouble.addEventListener('click', () => {
            app.adjustBudget('increaseDouble');
        });
        
        elements.closeBudgetAdjustment.addEventListener('click', (e) => {
            e.stopPropagation(); // Prevent triggering the progress container click
            app.hideBudgetAdjustment();
        });
        
        // Prevent adjustment panel clicks from propagating to progress container
        elements.budgetAdjustmentPanel.addEventListener('click', (e) => {
            e.stopPropagation();
        });
        
        // Update working hours progress every minute
        setInterval(() => {
            displayManager.updateWorkingHoursProgress();
        }, 60000); // Update every 60 seconds
        
        // Initialize with default calculation for working days info
        try {
            elements.info.textContent = `Enter your budget to see daily spending limit`;
            
            // Initialize progress bar with all consolidated information
            displayManager.updateProgressBar();
        } catch (error) {
            displayManager.showError('Unable to calculate working days');
        }
    </script>
</body>
</html>
